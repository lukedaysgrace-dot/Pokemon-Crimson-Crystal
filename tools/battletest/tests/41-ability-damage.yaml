# Paired-control tests for ability damage modifiers. Each control is retained
# by id, then the ability case runs with identical species, levels, move,
# target, and deterministic RNG.

- name: "Huge Power control damage"
  id: huge_power_control
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [TACKLE] }
  enemy: { species: MEW, level: 100, moves: [SPLASH] }
  rng: forced_high
  turns: 1
- name: "Ability: Huge Power doubles physical power"
  player: { species: SNORLAX, level: 50, ability: HUGE_POWER, moves: [TACKLE] }
  enemy: { species: MEW, level: 100, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["enemy.start_hp - enemy.hp > result('huge_power_control')['enemy']['damage']"]

