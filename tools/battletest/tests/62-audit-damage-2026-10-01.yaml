# Per-side critical-hit stat selection and burn exceptions.
# Every paired assertion uses the same move, species, levels and RNG.

- name: "Audit damage: player tackle positive offense critical control"
  id: player_tackle_crit_positive
  player: {"species": "MEW", "level": 20, "ability": "NO_ABILITY", "moves": ["TACKLE"], "item": "SCOPE_LENS", "stages": {"atk": 2}}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"]}
  rng: forced_low
  turns: 1
  assert: ["enemy.hp < enemy.start_hp"]

- name: "Audit damage: player tackle critical retains positive offense while ignoring positive defense"
  player: {"species": "MEW", "level": 20, "ability": "NO_ABILITY", "moves": ["TACKLE"], "item": "SCOPE_LENS", "stages": {"atk": 2}}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"], "stages": {"def": 4}}
  rng: forced_low
  turns: 1
  assert: ["enemy.hp < enemy.start_hp", "enemy.start_hp - enemy.hp == result('player_tackle_crit_positive')['enemy'][\"damage\"]"]

