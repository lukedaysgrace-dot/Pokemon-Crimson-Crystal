# Native ROM held-item behavior and negative controls.
- name: 'Modern item: Cloak Body Slam NO_ITEM/NO_ABILITY #0'
  player:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - SPLASH
    item: NO_ITEM
  enemy:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - BODY_SLAM
  rng: forced_low
  turns: 1
  assert:
  - player.status == 64
