# A Power Herb skips charging even when Skull Bash's Defense increase cannot apply.

- name: "Power Herb Skull Bash: player capped"
  player: { species: MEW, level: 50, ability: NO_ABILITY, item: POWER_HERB, moves: [SKULL_BASH], stages: { def: 6 } }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp
    - player.item == 'NO_ITEM'
    - player.pp[0] == 14
    - player.stat_levels[1] == 13

- name: "Power Herb Skull Bash: player normal"
  player: { species: MEW, level: 50, ability: NO_ABILITY, item: POWER_HERB, moves: [SKULL_BASH], stages: { def: 0 } }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp
