# Held items must obey effective abilities and preserve the move's result.
# Damage pairs share forced RNG; Gas restores the boost, opposing Mold Breaker does not.

- name: "Species item Klutz: player PIKACHU physical control"
  id: item_klutz_pikachu_physical_player_control
  player: { species: PIKACHU, level: 50, ability: NO_ABILITY, moves: [QUICK_ATTACK] }
  enemy: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp > 2

- name: "Species item Klutz: player PIKACHU physical active"
  id: item_klutz_pikachu_physical_player_active
  player: { species: PIKACHU, level: 50, ability: NO_ABILITY, item: LIGHT_BALL, moves: [QUICK_ATTACK] }
  enemy: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp > result('item_klutz_pikachu_physical_player_control')['enemy']['damage']

- name: "Species item Klutz: player PIKACHU physical klutz"
  player: { species: PIKACHU, level: 50, ability: KLUTZ, item: LIGHT_BALL, moves: [QUICK_ATTACK] }
  enemy: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp == result('item_klutz_pikachu_physical_player_control')['enemy']['damage']

