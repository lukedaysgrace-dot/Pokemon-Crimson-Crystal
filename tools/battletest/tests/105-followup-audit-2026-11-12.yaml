# Delayed Yawn: a status gained before resolution wins, and Neutralizing Gas
# still suppresses the drowsy holder's Leaf Guard when the sleep resolves.
- name: "Followup 1112: a status gained while drowsy cancels the pending sleep (enemy)"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [YAWN, THUNDER_WAVE]}
  enemy: {species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
