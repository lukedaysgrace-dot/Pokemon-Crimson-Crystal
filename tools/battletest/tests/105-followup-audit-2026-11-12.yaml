    - "enemy.status == 0"
    - "(enemy.substatus[4] & 1) == 0"
    - "enemy.hp == enemy.maxhp"
    - "wram('wEnemyToxicSlots') == 1"

- name: "Followup 1112: Baton Pass drops a stale bad-poison bit for a cured replacement"
