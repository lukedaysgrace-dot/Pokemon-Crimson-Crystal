# Guard counter: a failed attempt and a switch both reset it.
- name: "Followup 1112: a failed Bunker resets the guard chance for the next one"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [BANEFUL_BUNKER]}
  enemy: {species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [TACKLE]}
  move_script: [1, 1, 1]
  rng: forced_high
  turns: 3
  turn_assert:
    - "turns_done != 1 or wram('wPlayerProtectCount') == 1"
    - "turns_done != 2 or wram('wPlayerProtectCount') == 0"
    - "turns_done != 3 or wram('wPlayerProtectCount') == 1"
  assert:
    - "wram('wPlayerProtectCount') == 1"

- name: "Followup 1112: switching out resets the Bunker guard chance"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [BANEFUL_BUNKER]}
  player2: {species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MAGIKARP, level: 5, ability: NO_ABILITY, moves: [TACKLE]}
  move_script: [1, "switch:2", "switch:1", 1]
  rng: forced_high
  turns: 4
  turn_assert:
    - "turns_done != 1 or wram('wPlayerProtectCount') == 1"
    - "turns_done != 2 or wram('wPlayerProtectCount') == 0"
  assert:
    - "player.species == 'MEW'"
    - "wram('wPlayerProtectCount') == 1"
    - "not textbox_seen('ButItFailedText')"

# Poison Touch is a contact reaction: no contact or a Substitute means no
# poison, and Neutralizing Gas suppresses the ability itself.
- name: "Followup 1112: Poison Touch needs contact (player)"
  player: {species: MEW, level: 50, ability: POISON_TOUCH, moves: [SWIFT]}
  enemy: {species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_low
  turns: 1
  assert: ["enemy.hp < enemy.maxhp", "enemy.status == 0"]

- name: "Followup 1112: Poison Touch needs contact (enemy)"
  player: {species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: POISON_TOUCH, moves: [SWIFT]}
  rng: forced_low
  turns: 1
  assert: ["player.hp < player.maxhp", "player.status == 0"]

