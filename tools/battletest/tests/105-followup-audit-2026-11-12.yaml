# Follow-up review of the November 12 audit.
#
# Part 1 covers a defect found in this pass: Yawn's delayed sleep and Taunt's
# wear-off message ran for a battler that had already fainted earlier in the
# same end-of-turn sequence (weather damage here). Fainted slots stay empty
# until every residual phase has finished, so the handlers must skip them, as
# Wish already does.
#
# Part 2 adds behavioral assertions the first audit's cases did not make for
# its own fixes: recalculated battle stats, protection bypass on self-drops,
# every PP-Up value, Baton Pass poison controls and guard-counter resets.

# ---- Part 1: pending Yawn / Taunt and a slot that fainted this turn --------

- name: "Followup 1112: pending Yawn skips a player mon that fainted to weather"
  player: {species: MAGIKARP, level: 50, hp: 2, ability: NO_ABILITY, moves: [SPLASH]}
  player2: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wPlayerYawnCount: 1}
  weather: sandstorm
  rng: forced_high
  turns: 1
  assert:
    - "player.species == 'SANDSLASH'"
    - "player.status == 0"
    - "wram16('wPartyMon1HP') == 0"
    - "wram('wPartyMon1Status') == 0"
    - "wram('wPlayerYawnCount') == 0"
    - "not textbox_seen('FellAsleepText')"

- name: "Followup 1112: pending Yawn skips an enemy mon that fainted to weather"
  player: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MAGIKARP, level: 50, hp: 2, ability: NO_ABILITY, moves: [SPLASH]}
  enemy2: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wEnemyYawnCount: 1}
  weather: sandstorm
  rng: forced_high
  turns: 1
  assert:
    - "enemy.species == 'SANDSLASH'"
    - "enemy.status == 0"
    - "wram16('wOTPartyMon1HP') == 0"
    - "wram('wOTPartyMon1Status') == 0"
    - "wram('wEnemyYawnCount') == 0"
    - "not textbox_seen('FellAsleepText')"

- name: "Followup 1112 control: a living drowsy player mon still falls asleep in weather"
  player: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wPlayerYawnCount: 1}
  weather: sandstorm
  rng: forced_high
  turns: 1
  assert:
    - "(player.status & 7) != 0"
    - "textbox_seen('FellAsleepText')"

- name: "Followup 1112 control: a living drowsy enemy mon still falls asleep in weather"
  player: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: SANDSLASH, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wEnemyYawnCount: 1}
  weather: sandstorm
  rng: forced_high
  turns: 1
  assert:
    - "(enemy.status & 7) != 0"
    - "textbox_seen('FellAsleepText')"

