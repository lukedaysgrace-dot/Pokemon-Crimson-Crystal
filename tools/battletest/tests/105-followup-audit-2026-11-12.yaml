# ---- Part 2: additional assertions for the first audit's fixes -------------

# Curse: the stage changes must reach the recalculated battle stats.
- name: "Followup 1112: Curse recalculates all three battle stats"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert:
    - "player.stat_levels[0] == 8 and player.stat_levels[1] == 8 and player.stat_levels[2] == 6"
    - "player.stats['attack'] == player.start_stats['attack'] * 3 // 2"
    - "player.stats['defense'] == player.start_stats['defense'] * 3 // 2"
    - "player.stats['speed'] == player.start_stats['speed'] * 66 // 100"

- name: "Followup 1112: enemy Curse recalculates all three battle stats"
  player: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, moves: [CURSE]}
  rng: forced_high
  turns: 1
  assert:
    - "enemy.stat_levels[0] == 8 and enemy.stat_levels[1] == 8 and enemy.stat_levels[2] == 6"
    - "enemy.stats['attack'] == enemy.start_stats['attack'] * 3 // 2"
    - "enemy.stats['defense'] == enemy.start_stats['defense'] * 3 // 2"
    - "enemy.stats['speed'] == enemy.start_stats['speed'] * 66 // 100"

- name: "Followup 1112: Contrary Curse recalculates the reversed battle stats"
  player: {species: MEW, level: 50, ability: CONTRARY, moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert:
    - "player.stats['attack'] == player.start_stats['attack'] * 66 // 100"
    - "player.stats['defense'] == player.start_stats['defense'] * 66 // 100"
    - "player.stats['speed'] == player.start_stats['speed'] * 3 // 2"

- name: "Followup 1112: enemy Contrary Curse recalculates the reversed battle stats"
  player: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: CONTRARY, moves: [CURSE]}
  rng: forced_high
  turns: 1
  assert:
    - "enemy.stats['attack'] == enemy.start_stats['attack'] * 66 // 100"
    - "enemy.stats['defense'] == enemy.start_stats['defense'] * 66 // 100"
    - "enemy.stats['speed'] == enemy.start_stats['speed'] * 3 // 2"

# The Speed change now runs through the targeted stat-drop command with the
# turn switched. It is still a self-inflicted drop: the user's own Mist,
# Substitute and Clear Body do not block it, and the foe's Defiant, which
# reacts to drops it suffers, is not involved.
- name: "Followup 1112: Curse's Speed drop ignores the user's own Mist and Substitute"
  player: {species: MEW, level: 50, ability: NO_ABILITY, substatus: [MIST, SUBSTITUTE], moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wPlayerSubstituteHP: 40}
  rng: forced_high
  turns: 1
  assert: ["player.stat_levels[0] == 8", "player.stat_levels[1] == 8", "player.stat_levels[2] == 6"]

- name: "Followup 1112: enemy Curse's Speed drop ignores its own Mist and Substitute"
  player: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, substatus: [MIST, SUBSTITUTE], moves: [CURSE]}
  setup_wram: {wEnemySubstituteHP: 40}
  rng: forced_high
  turns: 1
  assert: ["enemy.stat_levels[0] == 8", "enemy.stat_levels[1] == 8", "enemy.stat_levels[2] == 6"]

- name: "Followup 1112: Clear Body does not block its holder's own Curse"
  player: {species: MEW, level: 50, ability: CLEAR_BODY, moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert:
    - "player.stat_levels[0] == 8 and player.stat_levels[1] == 8 and player.stat_levels[2] == 6"
    - "not ability_seen('CLEAR_BODY')"

- name: "Followup 1112: enemy Clear Body does not block its holder's own Curse"
  player: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: CLEAR_BODY, moves: [CURSE]}
  rng: forced_high
  turns: 1
  assert:
    - "enemy.stat_levels[0] == 8 and enemy.stat_levels[1] == 8 and enemy.stat_levels[2] == 6"
    - "not ability_seen('CLEAR_BODY')"

- name: "Followup 1112: Curse's own Speed drop does not trigger Defiant"
  player: {species: MEW, level: 50, ability: DEFIANT, moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: DEFIANT, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert:
    - "player.stat_levels[0] == 8 and player.stat_levels[1] == 8 and player.stat_levels[2] == 6"
    - "enemy.stat_levels[0] == 7"
    - "not ability_seen('DEFIANT')"

- name: "Followup 1112: enemy Curse's own Speed drop does not trigger Defiant"
  player: {species: MAGIKARP, level: 50, ability: DEFIANT, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: DEFIANT, moves: [CURSE]}
  rng: forced_high
  turns: 1
  assert:
    - "enemy.stat_levels[0] == 8 and enemy.stat_levels[1] == 8 and enemy.stat_levels[2] == 6"
    - "player.stat_levels[0] == 7"
    - "not ability_seen('DEFIANT')"

