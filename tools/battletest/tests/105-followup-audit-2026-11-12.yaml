# Baton Pass: the restore must not upgrade ordinary poison, poison a healthy
# replacement, or keep a history bit for a replacement whose poison was cured.
- name: "Followup 1112: Baton Pass leaves the incoming mon's ordinary poison ordinary"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [BATON_PASS]}
  player2: {species: SNORLAX, level: 50, ability: NO_ABILITY, status_byte: 8, moves: [SPLASH]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert:
    - "player.species == 'SNORLAX'"
    - "player.status == 8"
    - "(player.substatus[4] & 1) == 0"
    - "wram('wPlayerToxicSlots') == 0"

- name: "Followup 1112: enemy Baton Pass leaves the incoming mon's ordinary poison ordinary"
  player: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, moves: [BATON_PASS]}
  enemy2: {species: SNORLAX, level: 50, ability: NO_ABILITY, status_byte: 8, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert:
    - "enemy.species == 'SNORLAX'"
    - "enemy.status == 8"
    - "(enemy.substatus[4] & 1) == 0"
    - "wram('wEnemyToxicSlots') == 0"

- name: "Followup 1112: a badly poisoned passer leaves a healthy replacement healthy"
  player: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 8, substatus: [TOXIC], moves: [BATON_PASS]}
  player2: {species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wPlayerToxicSlots: 1}
  rng: forced_high
  turns: 1
  assert:
    - "player.species == 'SNORLAX'"
    - "player.status == 0"
    - "(player.substatus[4] & 1) == 0"
    - "player.hp == player.maxhp"
    - "wram('wPlayerToxicSlots') == 1"

- name: "Followup 1112: a badly poisoned enemy passer leaves a healthy replacement healthy"
  player: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 8, substatus: [TOXIC], moves: [BATON_PASS]}
  enemy2: {species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
