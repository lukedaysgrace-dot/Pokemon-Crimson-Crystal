- name: "Move audit 11-13: Nightmare remains a status move through player King Shield"
  player: {species: MEW, level: 100, ability: NO_ABILITY, status_byte: 7, moves: [SLEEP_TALK, KINGS_SHIELD]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, moves: [NIGHTMARE]}
  rng: seeded
  rng_value: 29
  turns: 1
  assert:
    - textbox_seen('ProtectedItselfText')
    - (player.substatus[0] & 1) != 0
    - player.start_hp - player.hp == player.maxhp // 4

