  assert: ["enemy.hp < enemy.start_hp", "enemy.status == 0", "player.hp < player.start_hp", "enemy.pp[0] == 34"]

- name: "Second ability pass control: Stench preserves Ember's successful burn roll"
  player: {species: MEW, level: 50, ability: STENCH, moves: [EMBER]}
  enemy: {species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [TACKLE]}
  rng: forced
  rng_value: 20
  turns: 1
  assert: ["enemy.hp < enemy.start_hp", "(enemy.status & 16) != 0", "player.hp == player.start_hp"]

