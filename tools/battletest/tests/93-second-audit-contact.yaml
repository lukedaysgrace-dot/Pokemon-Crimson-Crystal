# Shell Side Arm is contact only when its resolved category is physical.
# The static ContactMoves bit is deliberately clear; the runtime category
# must drive abilities, held items and AI contact-risk scoring.

- name: "Second audit: physical player Shell Side Arm triggers Iron Barbs"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [SHELLSIDEARM]}
  enemy: {species: MEW, level: 100, ability: IRON_BARBS, moves: [SPLASH]}
  setup_wram: {wBattleMonAttack: [0, 250], wBattleMonSpclAtk: [0, 20]}
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp
    - wram('wPlayerMoveStructCategory') == 0
    - player.start_hp - player.hp == player.maxhp // 8

- name: "Second audit: special player Shell Side Arm avoids Iron Barbs"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [SHELLSIDEARM]}
  enemy: {species: MEW, level: 100, ability: IRON_BARBS, moves: [SPLASH]}
  setup_wram: {wBattleMonAttack: [0, 20], wBattleMonSpclAtk: [0, 250]}
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp
    - wram('wPlayerMoveStructCategory') == 1
    - player.hp == player.start_hp

