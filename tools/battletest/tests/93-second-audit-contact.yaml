- name: "Second audit: AI avoids physical Shell Side Arm into Rocky Helmet"
  player: {species: MEW, level: 100, ability: NO_ABILITY, item: ROCKY_HELMET, substatus: [CANT_RUN], moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, moves: [SPLASH, SHELLSIDEARM]}
  enemy2: {species: MEW, level: 50, ability: NO_ABILITY, moves: [TACKLE]}
  enemy_class: FALKNER
  setup_wram: {wEnemyMonAttack: [0, 250], wEnemyMonSpclAtk: [0, 20]}
  rng: forced_high
  turns: 1
  assert: ["enemy_move() == 'SPLASH'"]

