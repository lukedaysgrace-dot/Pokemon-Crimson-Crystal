- name: "Second audit: physical player Shell Side Arm triggers Rocky Helmet"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [SHELLSIDEARM]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, item: ROCKY_HELMET, moves: [SPLASH]}
  setup_wram: {wBattleMonAttack: [0, 250], wBattleMonSpclAtk: [0, 20]}
  rng: forced_high
  turns: 1
  assert: ["enemy.hp < enemy.start_hp", "player.start_hp - player.hp == player.maxhp // 6"]

