  turns: 1
  assert:
    - enemy.stat_levels[0] == 7

- name: "Ability: Hyper Cutter protects Attack but not Defense"
  player: { species: MACHAMP, level: 50, moves: [GROWL, TAIL_WHIP] }
  enemy:  { species: SCYTHER, level: 50, ability: HYPER_CUTTER, moves: [SPLASH] }
