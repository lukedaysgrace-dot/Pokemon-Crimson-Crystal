- name: "Ability: Magic Guard blocks poison and sandstorm chip"
  player: { species: PONYTA_GALARIAN, level: 50, ability: MAGIC_GUARD, status_byte: 8, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
