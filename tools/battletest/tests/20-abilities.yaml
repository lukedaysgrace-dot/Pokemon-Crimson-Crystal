# ---- turn order -------------------------------------------------------

- name: "Ability: Swift Swim doubles Speed in rain (order)"
  player: { species: GOLDEEN, level: 50, ability: SWIFT_SWIM, moves: [SPLASH] }
  enemy:  { species: PIKACHU, level: 50, moves: [SPLASH] }
  weather: rain
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 0

- name: "Ability: Swift Swim control - without rain the faster foe moves first"
  player: { species: GOLDEEN, level: 50, ability: SWIFT_SWIM, moves: [SPLASH] }
  enemy:  { species: PIKACHU, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 1

- name: "Ability: Triage gives healing moves +3 priority"
  player: { species: MEGANIUM, level: 50, ability: TRIAGE, hp: 50, moves: [RECOVER] }
  enemy:  { species: ELECTRODE, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 0
    - player.hp > player.start_hp

# ---- not covered here (see ability_testing_checklist.csv) -------------
# Pressure: implemented as an entry NOTIFICATION only in this engine (no
#   extra PP drain), so there is no WRAM observable - checklist agrees
#   ("Entry - notification"). If the PP mechanic is ever added, assert
#   player.pp[0] == player.start_pp[0] - 2 after a move that targets it.
# Banners/text/sprites (Frisk, Unnerve, Pressure text, Disguise sprites):
#   visual - Lucas's manual DEBUG menu is the tool for those.
# Download: no legal user in the dex yet.
# Magma Armor: its only user is Fire-type, which cannot be frozen anyway.
# Attract/Oblivious: needs gender control via DVs; harness sets DVs $FFFF.
# Regenerator / player-side Natural Cure: needs a voluntary player switch,
#   which auto mode does not script yet (only Baton Pass).
# Merciless / Serene Grace / Sheer Force / Skill Link / damage multipliers
#   (Guts, Quick Feet stat math, Dry Skin fire +25%): need golden damage
#   values - add them the way audit 1b/2b did, one verified number at a time.
