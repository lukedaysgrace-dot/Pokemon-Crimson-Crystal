# ---- stat-drop protection and reactions ------------------------------

- name: "Ability: Mirror Armor bounces stat drops back"
  player: { species: MACHAMP, level: 50, moves: [GROWL] }
  enemy:  { species: CORVIKNIGHT, level: 50, ability: MIRROR_ARMOR, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.stat_levels[0] == 7    # drop refused...
    - player.stat_levels[0] == 6   # ...and reflected onto the user

- name: "Ability: Clear Body blocks stat drops"
  player: { species: MACHAMP, level: 50, moves: [GROWL] }
  enemy:  { species: DREEPY, level: 50, ability: CLEAR_BODY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.stat_levels[0] == 7

- name: "Ability: White Smoke blocks stat drops"
  player: { species: MACHAMP, level: 50, moves: [GROWL] }
