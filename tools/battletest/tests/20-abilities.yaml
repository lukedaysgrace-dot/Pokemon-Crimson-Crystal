# Phase 4 backfill: ability_testing_checklist.csv as executable cases.
#
# Scope: the HIGH-priority section plus every MEDIUM entry with a clean
# WRAM observable. Visual-only intents (banners, sprite corruption, text
# wording) stay manual - see the csv. Skipped with reasons at the bottom.
#
# Conventions: forced RNG unless a proc is under test (forced_low = every
# chance procs), directional assertions over golden damage numbers, and
# the species chosen for each ability holds it LEGALLY so entry hooks run.

# ---- entry abilities -------------------------------------------------

- name: "Ability: Trace copies the foe's ability and triggers it if entry-triggered"
  player: { species: PORYGON2, level: 50, ability: TRACE, moves: [SPLASH] }
  enemy:  { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - player.ability == 'INTIMIDATE'   # copied...
    - enemy.stat_levels[0] == 6        # ...and the traced Intimidate fired
    - text_seen('INTIMIDATE')           # ...and the rendered name was valid

- name: "Ability: Imposter transforms into the foe on entry"
  player: { species: DITTO, level: 50, ability: IMPOSTER }
  enemy:  { species: MACHAMP, level: 50, moves: [KARATE_CHOP] }
  rng: forced_high
  turns: 0
  assert:
    - "'KARATE_CHOP' in player.moves"

- name: "Ability: Neutralizing Gas suppresses the foe's entry ability"
  player: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:  { species: KOFFING, level: 50, ability: NEUTRALIZING_GAS, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - enemy.stat_levels[0] == 7   # Intimidate never landed

- name: "Ability: Sand Stream starts a sandstorm on entry"
  player: { species: GENGAR, level: 50, moves: [SPLASH] }
  enemy:  { species: TYRANITAR, level: 50, ability: SAND_STREAM, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - weather == 3

- name: "Ability: Drought starts sun on entry"
  player: { species: VULPIX, level: 50, ability: DROUGHT, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - weather == 2

- name: "Ability: Screen Cleaner clears both sides' screens on entry"
  # Screens are pre-set via the request, then Mr. Rime enters through the
  # post-faint switch and must wipe them.
  player:  { species: RATTATA, level: 5, hp: 1, moves: [SPLASH] }
  player2: { species: MR__RIME, level: 50, ability: SCREEN_CLEANER, moves: [SPLASH] }
  enemy:   { species: MACHAMP, level: 50, moves: [TACKLE] }
  enemy_screens: 24   # reflect | light screen
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'MR__RIME'
    - (enemy.screens & 24) == 0

