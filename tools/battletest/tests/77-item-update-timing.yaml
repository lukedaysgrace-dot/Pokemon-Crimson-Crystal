# Observe HP-item updates before the next native action.
- name: 'Item update: player Skill Swap KLUTZ to RIPEN BERRY'
  player:
    species: BUNEARY
    level: 100
    ability: KLUTZ
    item: BERRY
    moves:
    - SKILL_SWAP
  enemy:
    species: APPLIN
    level: 30
    ability: RIPEN
    item: BERRY
    moves:
    - SPLASH
  setup_wram:
    wBattleMonHP:
    - 0
    - 1
    wEnemyMonHP:
    - 0
    - 1
  rng: forced_high
  turns: 1
  before_action:
  - side: enemy
    assert:
    - player.ability == 'RIPEN'
    - enemy.ability == 'KLUTZ'
    - enemy.item == 'BERRY'
    - enemy.hp == 1
    - player.hp == 21
    - player.item == 'NO_ITEM'
  assert:
  - player.ability == 'RIPEN'
  - enemy.ability == 'KLUTZ'
  - enemy.item == 'BERRY'
  - enemy.hp == 1
  - player.hp == 21
  - player.item == 'NO_ITEM'
  - wram('wInAbility') == 0
  - wram('wSelfdestructGasTurn') == 0
