# Octazooka uses one 20% roll for paired Defense and Special Defense drops.
- player:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - OCTAZOOKA
  enemy:
    species: SNORLAX
    level: 100
    ability: NO_ABILITY
    moves:
    - SPLASH
  rng: forced_low
  turns: 1
  id: oct_proc
  name: 'Octazooka: one roll lowers both defenses'
  assert:
  - enemy.stat_levels[1] == 6
  - enemy.stat_levels[4] == 6
  - enemy.hp < enemy.start_hp
  - enemy.stat_levels[5] == 7
  - player.stat_levels == player.start_stat_levels
  - enemy.stats["defense"] < enemy.start_stats["defense"]
  - enemy.stats["spcldef"] < enemy.start_stats["spcldef"]
