- name: "Ability audit: reflected Yawn causes drowsiness rather than immediate sleep"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [YAWN] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerYawnCount') == 1", "wram('wEnemyYawnCount') == 0", "player.status == 0", "enemy.status == 0"]

