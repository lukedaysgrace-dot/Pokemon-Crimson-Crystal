# Modern interactions, retaining the game's documented custom ability rules.

- name: "Ability audit: Neutralizing Gas cannot suppress Disguise"
  player: { species: WEEZING, level: 50, ability: NEUTRALIZING_GAS, moves: [WATER_GUN] }
  enemy: { species: MIMIKYU, level: 100, ability: DISGUISE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["enemy.hp == enemy.start_hp", "(wram('wDisguiseBusted', 1) & 1) != 0"]

- name: "Ability audit: Magic Bounce reflects Leech Seed"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LEECH_SEED] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["(player.substatus[3] & 128) != 0", "(enemy.substatus[3] & 128) == 0"]

- name: "Ability audit: Magic Bounce reflects Taunt"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [TAUNT] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerTauntCount') == 3", "wram('wEnemyTauntCount') == 0"]

- name: "Ability audit: Magic Bounce reflects Torment"
