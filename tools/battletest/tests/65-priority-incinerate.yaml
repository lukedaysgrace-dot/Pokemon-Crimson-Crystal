- id: inc_harvest_low
  name: Incinerate destroys a threshold berry before Harvest can restore it
  player:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - INCINERATE
  enemy:
    species: SNORLAX
    level: 50
    ability: HARVEST
    moves:
    - SPLASH
    hp: 55
    item: GOLD_BERRY
  rng: forced_high
  turns: 1
  assert:
  - enemy.hp < enemy.start_hp
  - enemy.item == 'NO_ITEM'
  - wram('wEnemyConsumedItem') == 0
  weather: sun
- id: inc_infiltrator
  name: Infiltrator Incinerate burns the berry through Substitute
  player:
    species: MEW
    level: 50
    ability: INFILTRATOR
    moves:
    - INCINERATE
  enemy:
    species: SNORLAX
    level: 50
    ability: NO_ABILITY
    moves:
    - SPLASH
    item: GOLD_BERRY
    substatus:
    - SUBSTITUTE
  rng: forced_high
  turns: 1
  assert:
  - enemy.hp < enemy.start_hp
  - enemy.item == 'NO_ITEM'
  - wram('wEnemySubstituteHP') == 255
  setup_wram:
    wEnemySubstituteHP: 255
- id: inc_klutz
  name: Incinerate destroys a berry suppressed by Klutz
  player:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - INCINERATE
  enemy:
    species: SNORLAX
    level: 50
    ability: KLUTZ
    moves:
    - SPLASH
    item: GOLD_BERRY
  rng: forced_high
  turns: 1
  assert:
  - enemy.item == 'NO_ITEM'
- id: inc_party_item
  name: Incinerate also clears the player party held item
  player:
    species: SNORLAX
    level: 50
    ability: NO_ABILITY
    moves:
    - SPLASH
    item: GOLD_BERRY
  enemy:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - INCINERATE
  rng: forced_high
  turns: 1
  assert:
  - player.item == 'NO_ITEM'
  - wram('wPartyMon1Item') == 0
