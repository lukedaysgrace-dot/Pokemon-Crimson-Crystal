# Priority and Incinerate behavior, including berry timing and knockout regressions.
- id: sp_physical
  name: Sucker Punch hits before a faster physical attacker
  player:
    species: SNORLAX
    level: 50
    ability: NO_ABILITY
    moves:
    - SUCKER_PUNCH
  enemy:
    species: MEW
    level: 50
    ability: NO_ABILITY
    moves:
    - TACKLE
  rng: forced_high
  turns: 1
  assert:
  - enemy.hp < enemy.start_hp
  - player.pp[0] == player.start_pp[0] - 1
  - wram('wEnemyGoesFirst') == 0
