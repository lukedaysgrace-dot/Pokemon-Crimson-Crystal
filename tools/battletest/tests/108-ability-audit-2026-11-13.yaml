  rng: forced_high
  turns: 1
  assert: ["player.hp > player.start_hp", "ability_seen('VOLT_ABSORB')"]

- name: "Ability audit: Mold Breaker keeps Ground immunity without Lightning Rod boost"
  player: {species: MEW, level: 30, ability: MOLD_BREAKER, moves: [THUNDERBOLT]}
