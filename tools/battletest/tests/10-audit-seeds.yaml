# The August 2026 audit (_ai_artifacts/reports/CODE_AUDIT_2026-08.md) as regression tests.
#
# Verified cases run unskipped. The remaining skips are blocked on missing
# harness features (player2 switch flow, trainer battles, substatus setup)
# or open engine questions - each notes exactly what it needs.
# Full acceptance (fail-on-pre-fix-commit) is still to be done per test.

- name: "Audit 1a: Aftermath triggers when holder is KOd by contact move"
  # Verified 2026-08-09: L50 Tauros (150 max HP) takes exactly 37 (25%)
  # from KOing a 1-HP Aftermath Electrode with Body Slam.
  player: { species: TAUROS,  level: 50, moves: [BODY_SLAM] }
  enemy:  { species: ELECTRODE, level: 5, ability: AFTERMATH, hp: 1, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == 0
    - player.start_hp - player.hp == 37   # maxhp 150 / 4

- name: "Audit 1b: attacker's Life Orb recoils after contact, defender's does not"
  # Verified: attacker loses exactly 10% max HP; Splash-ing defender with
  # its own Life Orb loses only the move damage.
  player: { species: TAUROS,  level: 50, item: LIFE_ORB, moves: [BODY_SLAM] }
  enemy:  { species: SNORLAX, level: 50, item: LIFE_ORB, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.start_hp - player.hp == 15   # maxhp 150 / 10
    - enemy.start_hp - enemy.hp == 105    # golden: Body Slam + Life Orb boost

- name: "Audit 2b-i: Refrigerate turns Swift into Ice (4x OHKO on Gligar)"
  # Normal-type Swift cannot OHKO L50 Gligar; Refrigerate-converted Ice
  # Swift (x1.1875 and 4x effective) does. Control case below.
  player: { species: AMAURA, level: 50, ability: REFRIGERATE, moves: [SWIFT] }
  enemy:  { species: GLIGAR, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == 0

- name: "Audit 2b-ii: without Refrigerate the same Swift stays Normal"
  player: { species: AMAURA, level: 50, ability_slot: 2, moves: [SWIFT] } # Solid Rock
  enemy:  { species: GLIGAR, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp == 29   # golden, Normal Swift, max roll

# wEnemyGoesFirst (via the wram accessor) holds the LAST resolved turn's
# order: 1 = enemy moved first, 0 = player moved first.
- name: "Audit 2a-i: Gale Wings gives Flying moves +1 priority"
  # Talonflame (base 126 Spd) is slower than Electrode (150); Gale Wings
  # Peck moves first anyway.
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [PECK] }
  enemy:  { species: ELECTRODE, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 0

- name: "Audit 2a-ii: Gale Wings does not boost non-Flying moves"
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [TACKLE] }
  enemy:  { species: ELECTRODE, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 1

- name: "Audit 3: enemy Natural Cure heals status on voluntary AI switch"
  # Trainer mode (enemy2 present; SCHOOLBOY class = SWITCH_OFTEN AI, no
  # items). The poisoned Natural Cure Chansey's only move (Tackle) cannot
  # touch Gengar at all, and Snorlax (immune to Ghost, Shadow Ball hits
  # super-effectively) is a perfect switch candidate - the AI gets a
  # near-certain voluntary-switch roll EVERY turn, so the switch converges
  # within the 4-turn window regardless of exact Random stream timing.
  # (Perish Song was tried first: it gives the AI only ONE roll at count 1,
  # which made the test timeline-sensitive.)
  player:  { species: GENGAR, level: 50, moves: [SPLASH] }
  enemy:   { species: CHANSEY, level: 50, ability: NATURAL_CURE, status_byte: 8, moves: [TACKLE] }
  enemy2:  { species: SNORLAX, level: 50, moves: [SHADOW_BALL] }
  rng: seeded
  turns: 4
  assert:
    - enemy.species == 'SNORLAX'          # the AI switched voluntarily
    - wram('wOTPartyMon1Status') == 0     # Natural Cure wiped the poison

# NOTE on audit 4a/4b: the audit bug was specifically about Roar's drag-in
# path, but a wild enemy's Roar ENDS the battle (forceswitch -> draw), so
# the true repro needs trainer-battle support. These cover the same entry-
# ability contract on the faint-replacement path, which the same fix serves.
- name: "Audit 4a: entry abilities fire for a replacement sent in after a faint"
  # Verified 2026-08-09 with the auto party-pick hook: Rattata faints turn
  # 1, Gyarados auto-switches in, Intimidate drops Machamp to stage 6.
  player:  { species: RATTATA,  level: 5, hp: 1, moves: [SPLASH] }
  player2: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:   { species: MACHAMP,  level: 50, moves: [TACKLE] }
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'GYARADOS'
    - enemy.stat_levels[0] == 6

- name: "Audit 4b: weather effects resume when the Cloud Nine holder leaves"
  # While Golduck (Cloud Nine) is in, wBattleWeather bit 7 (suppressed) is
  # set; after it faints and Raichu replaces it, rain persists unsuppressed.
  player:  { species: GOLDUCK, level: 5, ability: CLOUD_NINE, hp: 1, moves: [SPLASH] }
  player2: { species: RAICHU,  level: 50, moves: [SPLASH] }
  enemy:   { species: MACHAMP, level: 50, moves: [TACKLE] }
  weather: rain
  rng: forced_high
  turns: 1
  assert:
    - weather == 1                 # rain persisted...
    - (weather_raw & 128) == 0     # ...and is no longer suppressed

- name: "Audit 5a: Intimidate does not bypass Mist"
  # Mist is pre-set on the enemy via the request's substatus field; the
  # Intimidate mon enters via the post-faint switch, after Mist is up.
  player:  { species: RATTATA,  level: 5, hp: 1, moves: [SPLASH] }
  player2: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  # (not SUICUNE: roaming legendaries flee wild battles on turn 1)
  enemy:   { species: SNORLAX,  level: 50, moves: [TACKLE], substatus: [MIST] }
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'GYARADOS'
    - enemy.stat_levels[0] == 7   # Mist blocked the entry Intimidate

- name: "Audit 5b: Defiant answers Intimidate regardless of enemy's previous move"
  # Verified 2026-08-09 (after the StatDown hl-clobber fix): Bisharp ends
  # entry at attack stage 8 (-1 Intimidate, +2 Defiant).
  player: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:  { species: BISHARP,  level: 50, ability: DEFIANT, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - enemy.stat_levels[0] == 8   # -1 Intimidate, +2 Defiant

- name: "Audit 6: Shed Skin curing Toxic clears SUBSTATUS_TOXIC and counter"
  # Toxic state is pre-set via status_byte (PSN) + the substatus field;
  # forced_low makes Shed Skin's cure roll proc.
  player: { species: ARBOK, level: 50, ability: SHED_SKIN, status_byte: 8, substatus: [TOXIC], moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_low
  turns: 2
  assert:
    - player.status == 0                  # poison cured
    - (player.substatus[4] & 1) == 0      # SUBSTATUS_TOXIC cleared
    - wram('wPlayerToxicCount') == 0      # counter cleared

- name: "Audit 7: Magic Bounce does not reflect a Static proc onto the holder"
  # Verified: Espeon (Magic Bounce) gets paralyzed by Static on contact;
  # nothing bounces back to Pikachu.
  player: { species: ESPEON,  level: 50, ability: MAGIC_BOUNCE, moves: [TACKLE] }
  enemy:  { species: PIKACHU, level: 50, ability: STATIC, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - (player.status & 64) != 0   # Static procced onto the attacker...
    - (enemy.status & 64) == 0    # ...and was not reflected back

- name: "Audit 8: Rest fails for Insomnia / Vital Spirit users"
  # Verified: Hypno at 50% stays awake and unhealed after Rest.
  player: { species: HYPNO, level: 50, ability: INSOMNIA, hp: 50, moves: [REST] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - (player.status & 7) == 0    # not asleep
    - player.hp == player.start_hp  # and not healed

# Glaive Rush's vulnerability window clears at the start of the user's next
# turn anyway, so the pass-side observable here is the Rage Fist tally (and
# First Impression freshness); the control shows the tally accumulating.
- name: "Audit 9: Baton Pass resets the Rage Fist tally / First Impression"
  # Electrode outspeeds: tackle -> tally 1, tackle -> tally 2, then the
  # pass brings Raichu in with a clean slate.
  player:  { species: CHANSEY, level: 50, moves: [SPLASH, BATON_PASS] }
  player2: { species: RAICHU,  level: 50, moves: [SPLASH] }
  enemy:   { species: ELECTRODE, level: 50, moves: [TACKLE] }
  rng: forced_high
  move_script: [1, 2, 1]
  turns: 2
  assert:
    - player.species == 'RAICHU'
    - wram('wPlayerRageFistHits') == 0        # tally is per-mon, not passed
    - wram('wPlayerFirstImpressionFresh') == 1

- name: "Audit 9-control: the Rage Fist tally accumulates without Baton Pass"
  player:  { species: CHANSEY, level: 50, moves: [SPLASH, BATON_PASS] }
  enemy:   { species: ELECTRODE, level: 50, moves: [TACKLE] }
  rng: forced_high
  move_script: [1, 1]
  turns: 2
  assert:
    - wram('wPlayerRageFistHits') == 2

- name: "Audit 10-control: Thrash fatigue confuses a non-Own-Tempo user"
  # This test found a real engine bug on 2026-08-09: the callfar/farcall
  # macros load their target address into hl, so BattleCheckRampage_Core's
  # "set SUBSTATUS_CONFUSED, [hl]" (hl fetched before three callfars) wrote
  # into ROM instead - Thrash fatigue confusion never landed for ANY user.
  # Fixed by re-fetching the SUBSTATUS3 address after the calls.
  # Seeded rng 7 -> 2-turn Thrash, fatigue at end of turn 2.
  player: { species: SLOWBRO, level: 50, ability: OBLIVIOUS, moves: [THRASH] }
  enemy:  { species: SNORLAX, level: 100, moves: [SPLASH] }
  rng: seeded
  rng_value: 7
  turns: 3
  assert:
    - (player.substatus[2] & 128) != 0   # SUBSTATUS_CONFUSED after fatigue

- name: "Audit 10a: Own Tempo blocks Thrash fatigue confusion"
  player: { species: SLOWBRO, level: 50, ability: OWN_TEMPO, moves: [THRASH] }
  enemy:  { species: SNORLAX, level: 100, moves: [SPLASH] }
  rng: seeded
  rng_value: 7
  turns: 3
  assert:
    - (player.substatus[2] & 128) == 0   # fatigue confusion blocked, silently

- name: "Audit 10b: Own Tempo blocks Berserk Gene confusion (Attack boost stays)"
  player: { species: SLOWBRO, level: 50, ability: OWN_TEMPO, item: BERSERK_GENE, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - (player.substatus[2] & 128) == 0   # no confusion...
    - player.stat_levels[0] == 9         # ...but +2 Attack applied
    - player.item == 'NO_ITEM'           # gene is consumed
    - text_seen('BERSERK GENE')

- name: "Audit 10b-control: Berserk Gene confuses a non-Own-Tempo holder"
  player: { species: SLOWBRO, level: 50, ability: OBLIVIOUS, item: BERSERK_GENE, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - (player.substatus[2] & 128) != 0
    - player.stat_levels[0] == 9
