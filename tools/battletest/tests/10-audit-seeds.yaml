# The August 2026 audit (CODE_AUDIT_2026-08.md) as regression tests.
#
# Verified cases run unskipped. The remaining skips are blocked on missing
# harness features (player2 switch flow, trainer battles, substatus setup)
# or open engine questions - each notes exactly what it needs.
# Full acceptance (fail-on-pre-fix-commit) is still to be done per test.

- name: "Audit 1a: Aftermath triggers when holder is KOd by contact move"
  # Verified 2026-08-09: L50 Tauros (150 max HP) takes exactly 37 (25%)
  # from KOing a 1-HP Aftermath Electrode with Body Slam.
  player: { species: TAUROS,  level: 50, moves: [BODY_SLAM] }
  enemy:  { species: ELECTRODE, level: 5, ability: AFTERMATH, hp: 1, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == 0
    - player.start_hp - player.hp == 37   # maxhp 150 / 4

- name: "Audit 1b: attacker's Life Orb recoils after contact, defender's does not"
  # Verified: attacker loses exactly 10% max HP; Splash-ing defender with
  # its own Life Orb loses only the move damage.
  player: { species: TAUROS,  level: 50, item: LIFE_ORB, moves: [BODY_SLAM] }
  enemy:  { species: SNORLAX, level: 50, item: LIFE_ORB, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.start_hp - player.hp == 15   # maxhp 150 / 10
    - enemy.start_hp - enemy.hp == 105    # golden: Body Slam + Life Orb boost

- name: "Audit 2b-i: Refrigerate turns Swift into Ice (4x OHKO on Gligar)"
  # Normal-type Swift cannot OHKO L50 Gligar; Refrigerate-converted Ice
  # Swift (x1.1875 and 4x effective) does. Control case below.
  player: { species: AMAURA, level: 50, ability: REFRIGERATE, moves: [SWIFT] }
  enemy:  { species: GLIGAR, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == 0

- name: "Audit 2b-ii: without Refrigerate the same Swift stays Normal"
  player: { species: AMAURA, level: 50, ability_slot: 2, moves: [SWIFT] } # Solid Rock
  enemy:  { species: GLIGAR, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp == 29   # golden, Normal Swift, max roll

