- name: "Audit 7: Magic Bounce does not reflect a Static proc onto the holder"
  # Verified: Espeon (Magic Bounce) gets paralyzed by Static on contact;
  # nothing bounces back to Pikachu.
  player: { species: ESPEON,  level: 50, ability: MAGIC_BOUNCE, moves: [TACKLE] }
  enemy:  { species: PIKACHU, level: 50, ability: STATIC, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - (player.status & 64) != 0   # Static procced onto the attacker...
    - (enemy.status & 64) == 0    # ...and was not reflected back

- name: "Audit 8: Rest fails for Insomnia / Vital Spirit users"
  # Verified: Hypno at 50% stays awake and unhealed after Rest.
  player: { species: HYPNO, level: 50, ability: INSOMNIA, hp: 50, moves: [REST] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - (player.status & 7) == 0    # not asleep
    - player.hp == player.start_hp  # and not healed

