# The August 2026 audit (CODE_AUDIT_2026-08.md) as regression tests.
# Every case is written but marked skip until it has been run against
# current main AND shown to fail on the pre-fix commit for its bug -
# that acceptance step is what makes these worth having (handoff item 4).
# Unskip one at a time, verify, adjust golden values, commit.

- name: "Audit 1a: Aftermath triggers when holder is KOd by contact move"
  skip: "not yet verified"
  player: { species: TAUROS,  level: 50, moves: [BODY_SLAM] }
  enemy:  { species: ELECTRODE, level: 5, ability: AFTERMATH, hp: 1, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp < player.start_hp   # took Aftermath chip on the KO

- name: "Audit 1b: attacker's Life Orb recoils after contact, defender's does not"
  skip: "not yet verified"
  player: { species: TAUROS,  level: 50, item: LIFE_ORB, moves: [BODY_SLAM] }
  enemy:  { species: SNORLAX, level: 50, item: LIFE_ORB, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp < player.start_hp                  # attacker recoil
    - enemy.start_hp - enemy.hp > 0                # move damage only

- name: "Audit 2a: Gale Wings priority applies to Flying moves only"
  skip: "needs move-order introspection; add wEnemyGoesFirst accessor first"
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [PECK] }
  enemy:  { species: MACHAMP, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - turns_done == 1

- name: "Audit 2b: Refrigerate boosts Normal moves x1.1875, excludes Hidden Power"
  skip: "not yet verified; needs golden damage values"
  player: { species: GLACEON, level: 50, ability: REFRIGERATE, moves: [SWIFT] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp > 0

- name: "Audit 3: enemy Natural Cure heals status on voluntary AI switch"
  skip: "needs trainer-battle support (AI switching); wild mons never switch"

- name: "Audit 4a: Roar-ing in an Intimidate mon activates Intimidate"
  skip: "needs player2 switch-in flow verified; also see open Intimidate item"
  player:  { species: RAICHU,   level: 50, moves: [SPLASH] }
  player2: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:   { species: MACHAMP,  level: 50, moves: [ROAR] }
  rng: forced_low
  turns: 2
  assert:
    - enemy.stat_levels[0] == 6

- name: "Audit 4b: Roar-ing out a Cloud Nine holder restores weather"
  skip: "needs player2 switch verified"
  player:  { species: GOLDUCK,  level: 50, ability: CLOUD_NINE, moves: [SPLASH] }
  player2: { species: RAICHU,   level: 50, moves: [SPLASH] }
  enemy:   { species: MACHAMP,  level: 50, moves: [ROAR] }
  weather: rain
  rng: forced_low
  turns: 2
  assert:
    - weather == 1

- name: "Audit 5a: Intimidate does not bypass Mist"
  skip: "blocked on the open entry-Intimidate item"
  player: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:  { species: SUICUNE,  level: 50, moves: [MIST] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.stat_levels[0] == 7

- name: "Audit 5b: Defiant answers Intimidate regardless of enemy's previous move"
  skip: "blocked on the open entry-Intimidate item"
  player: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:  { species: BISHARP,  level: 50, ability: DEFIANT, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - enemy.stat_levels[0] == 6   # -1 from Intimidate...
    - enemy.stats['attack'] > enemy.start_stats['attack'] if False else True
    # ...then +2 from Defiant -> net stage 8; refine once verified

- name: "Audit 6: Shed Skin curing Toxic clears SUBSTATUS_TOXIC and counter"
  skip: "needs substatus poke support for toxic setup; add to Request"
  player: { species: ARBOK, level: 50, ability: SHED_SKIN, status_byte: 8, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_low
  turns: 3
  assert:
    - player.status == 0

- name: "Audit 7: Magic Bounce does not reflect a Static proc onto the holder"
  skip: "not yet verified"
  player: { species: ESPEON,  level: 50, ability: MAGIC_BOUNCE, moves: [TACKLE] }
  enemy:  { species: PIKACHU, level: 50, ability: STATIC, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - (enemy.status & 64) == 0   # Static's paralysis must not bounce back

- name: "Audit 8: Rest fails for Insomnia / Vital Spirit users"
  skip: "not yet verified"
  player: { species: HYPNO, level: 50, ability: INSOMNIA, hp: 50, moves: [REST] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - (player.status & 7) == 0   # not asleep
    - player.hp < player.maxhp   # and not healed

