# End-of-turn effects resolve globally by effect, then effective Speed.
# Ability suppression makes the stage order observable, without animation hooks.

- name: "Residual stages: poison precedes burn even when the burning Gas holder is faster"
  player: { species: TAUROS, level: 50, ability: NEUTRALIZING_GAS, hp: 5, status_byte: 16, moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: MAGIC_GUARD, hp: 50, status_byte: 8, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 0
    - enemy.start_hp - enemy.hp == enemy.maxhp // 8

- name: "Residual stages: poison precedes Curse even when the cursed Gas holder is faster"
  player: { species: TAUROS, level: 50, ability: NEUTRALIZING_GAS, hp: 5, substatus: [CURSE], moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: MAGIC_GUARD, hp: 50, status_byte: 8, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 0
    - enemy.start_hp - enemy.hp == enemy.maxhp // 8

- name: "Residual stages: a source that faints from its move cannot drain Leech Seed"
  player: { species: TAUROS, level: 50, ability: NO_ABILITY, hp: 5, moves: [EXPLOSION] }
  enemy: { species: GENGAR, level: 50, ability: NO_ABILITY, hp: 50, substatus: [LEECH_SEED], moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 0
    - enemy.hp == enemy.start_hp

- name: "Residual stages: a draining source receives only the victim's remaining HP"
  player: { species: TAUROS, level: 50, ability: NO_ABILITY, hp: 50, moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 5, substatus: [LEECH_SEED], moves: [SPLASH] }
  setup_wram: { wEnemyMonHP: [0, 5] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp - player.start_hp == 5
    - enemy.hp == 0

- name: "Residual stages: slower Leech Seed healing can save a poisoned source under Trick Room"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 15, status_byte: 8, moves: [SPLASH] }
  enemy: { species: TAUROS, level: 50, ability: NO_ABILITY, hp: 50, substatus: [LEECH_SEED], moves: [SPLASH] }
  setup_wram: { wTrickRoomTimer: 3 }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp + enemy.maxhp // 8 - player.maxhp // 8
    - enemy.start_hp - enemy.hp == enemy.maxhp // 8

- name: "Residual stages: Trick Room reverses Leech Seed's effective Speed order"
  player: { species: TAUROS, level: 50, ability: NO_ABILITY, hp: 50, substatus: [LEECH_SEED], moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 5, substatus: [LEECH_SEED], moves: [SPLASH] }
  setup_wram: { wTrickRoomTimer: 3 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == 0
    - player.hp - player.start_hp == enemy.start_hp
    - wram('wBattleEnded') == 1

- name: "Residual stages: without Trick Room the faster Leech Seed victim drains first"
  player: { species: TAUROS, level: 50, ability: NO_ABILITY, hp: 5, substatus: [LEECH_SEED], moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 50, substatus: [LEECH_SEED], moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 0
    - enemy.hp - enemy.start_hp == player.start_hp

- name: "Residual stages: binding ends if its source faints during the preceding Curse stage"
  player: { species: TAUROS, level: 50, ability: NO_ABILITY, hp: 5, substatus: [CURSE], moves: [SPLASH] }
  player2: { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 50, moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 50, moves: [SPLASH] }
  setup_wram: { wEnemyWrapCount: 3 }
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'SNORLAX'
    - player.hp == player.maxhp // 2
    - enemy.hp == enemy.start_hp
    - wram('wEnemyWrapCount') == 0

- name: "Residual stages: Immunity resumes after Leech Seed knocks out Neutralizing Gas"
  player: { species: TAUROS, level: 50, ability: NEUTRALIZING_GAS, hp: 5, substatus: [LEECH_SEED], moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: IMMUNITY, hp: 50, status_byte: 8, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 0
    - enemy.hp - enemy.start_hp == player.start_hp
    - enemy.status == 0
    - wram('wNeutralizingGasActive') == 0

- name: "Residual stages: Drizzle resumes before later stages when Leech Seed knocks out Gas"
  player: { species: TAUROS, level: 50, ability: NEUTRALIZING_GAS, hp: 5, substatus: [LEECH_SEED], moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: DRIZZLE, hp: 50, moves: [SPLASH] }
  # Debug ability overrides happen after entry, so initialize Gas's entry flag.
  setup_wram: { wNeutralizingGasActive: 1 }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 0
    - enemy.hp - enemy.start_hp == player.start_hp
    - wram('wBattleWeather') == 1
    - wram('wNeutralizingGasActive') == 0

