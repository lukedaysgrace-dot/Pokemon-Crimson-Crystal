- name: "Bounce regression: reflected Yawn respects the source Substitute"
  player: { species: MEW, level: 50, ability: NO_ABILITY, substatus: [SUBSTITUTE], moves: [YAWN] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, substatus: [SUBSTITUTE], moves: [SPLASH] }
  setup_wram: { wPlayerSubstituteHP: 100, wEnemySubstituteHP: 100 }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerYawnCount') == 0", "wram('wEnemyYawnCount') == 0", "player.status == 0", "enemy.status == 0"]

- name: "Bounce regression: reflected Yawn sleeps the source on the next turn"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [YAWN, SPLASH] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  move_script: [1, 2]
  rng: forced_high
  turns: 2
  assert: ["(player.status & 7) != 0", "enemy.status == 0", "wram('wPlayerYawnCount') == 0"]

- name: "Bounce regression: a reflected hazard spends only the source PP"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [SPIKES] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["player.start_pp[0] - player.pp[0] == 1", "enemy.start_pp[0] - enemy.pp[0] == 1", "enemy.moves[0] == 'SPLASH'", "enemy_move() == 'SPLASH'"]

- name: "Bounce regression: delayed Yawn sleep cannot bounce again"
  player: { species: ESPEON, level: 50, ability: MAGIC_BOUNCE, moves: [YAWN, SPLASH] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  move_script: [1, 2]
  rng: forced_high
  turns: 2
  assert: ["(player.status & 7) != 0", "enemy.status == 0", "(wram('wDisguiseBusted', 1) & 64) == 0"]

- name: "Bounce regression: enemy Taunt is reflected onto the enemy"
  player: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, moves: [TAUNT] }
  rng: forced_high
  turns: 1
