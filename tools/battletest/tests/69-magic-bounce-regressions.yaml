- name: "Bounce regression: reflected Torment bypasses the source Substitute"
  player: { species: MEW, level: 50, ability: NO_ABILITY, substatus: [SUBSTITUTE], moves: [TORMENT] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, substatus: [SUBSTITUTE], moves: [SPLASH] }
