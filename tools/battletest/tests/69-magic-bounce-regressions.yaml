- name: "Bounce regression: Circle Throw damage and phazing cannot be reflected"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [CIRCLE_THROW] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  enemy2: { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced
  rng_value: 1
  turns: 1
  assert: ["player.hp == player.start_hp", "enemy.species == 'SNORLAX'", "not ability_seen('MAGIC_BOUNCE')"]

- name: "Bounce regression: a flying holder cannot reflect Spikes"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [SPIKES] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, substatus: [FLYING], moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerSpikesLayers') == 0", "wram('wEnemySpikesLayers') == 1", "not ability_seen('MAGIC_BOUNCE')"]

- name: "Bounce regression: Disable locks the source's current move"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [DISABLE, SPLASH] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  move_script: [2, 1]
  rng: forced_high
  turns: 2
  assert: ["wram('wPlayerDisableCount') % 16 == 4", "wram('wDisabledMove') == wram('wBattleMonMoves')", "wram('wEnemyDisableCount') == 0", "enemy_move() == 'SPLASH'"]

- name: "Bounce regression: Encore cannot encore the source's current Encore"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [ENCORE, SPLASH] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  move_script: [2, 1]
  rng: forced_high
  turns: 2
  assert: ["wram('wPlayerEncoreCount') == 0", "wram('wEnemyEncoreCount') == 0", "ability_seen('MAGIC_BOUNCE')", "enemy_move() == 'SPLASH'", "player.start_pp[0] - player.pp[0] == 1", "player.start_pp[1] - player.pp[1] == 1"]

