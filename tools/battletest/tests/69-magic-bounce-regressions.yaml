- name: "Bounce regression: Mold Breaker bypasses reflection"
  player: { species: MEW, level: 50, ability: MOLD_BREAKER, moves: [TAUNT] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerTauntCount') == 0", "wram('wEnemyTauntCount') == 3"]

- name: "Bounce regression: Neutralizing Gas suppresses reflection"
  player: { species: WEEZING, level: 50, ability: NEUTRALIZING_GAS, moves: [SPIKES] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerSpikesLayers') == 0", "wram('wEnemySpikesLayers') == 1"]

- name: "Bounce regression: two Magic Bounce holders cannot reflect repeatedly"
  player: { species: ESPEON, level: 50, ability: MAGIC_BOUNCE, moves: [TAUNT] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerTauntCount') == 3", "wram('wEnemyTauntCount') == 0", "wram('wInAbility') == 0", "(wram('wDisguiseBusted', 1) & 64) == 0"]

- name: "Bounce regression: reflected Leech Seed fails on a Grass source"
  player: { species: BULBASAUR, level: 50, ability: NO_ABILITY, moves: [LEECH_SEED] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, substatus: [SUBSTITUTE], moves: [SPLASH] }
  setup_wram: { wEnemySubstituteHP: 100 }
  rng: forced_high
  turns: 1
  assert: ["(player.substatus[3] & 128) == 0", "(enemy.substatus[3] & 128) == 0"]

- name: "Bounce regression: Sap Sipper absorbs reflected Leech Seed"
  player: { species: MEW, level: 50, ability: SAP_SIPPER, moves: [LEECH_SEED] }
  enemy: { species: ESPEON, level: 100, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["(player.substatus[3] & 128) == 0", "(enemy.substatus[3] & 128) == 0", "player.stat_levels[0] == 8"]

