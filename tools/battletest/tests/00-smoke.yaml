# Smoke suite - every case here was verified green on 2026-08-09.
# These prove the harness itself: setup, ability derivation, forced RNG,
# proc/no-proc isolation, entry abilities and weather overrides.

- name: Levitate blocks Earthquake
  player: { species: GENGAR,  level: 50, ability: LEVITATE, moves: [LICK] }
  enemy:  { species: MACHAMP, level: 50, moves: [EARTHQUAKE] }
  rng: forced_low
  turns: 1
  assert:
    - player.hp == player.maxhp
    - enemy.hp < enemy.maxhp   # Lick still connected

- name: Lick paralyzes under forced_low
  player: { species: GENGAR,  level: 50, moves: [LICK] }
  enemy:  { species: MACHAMP, level: 50, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - (enemy.status & 64) != 0   # PAR bit

- name: Lick does not paralyze under forced_high
  player: { species: GENGAR,  level: 50, moves: [LICK] }
  enemy:  { species: MACHAMP, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.status == 0
    - enemy.hp < enemy.start_hp   # but the move itself landed

- name: Forced RNG gives exact reproducible damage
  player: { species: GENGAR,  level: 50, moves: [LICK] }
  enemy:  { species: MACHAMP, level: 50, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp == 13   # golden value, max roll, no crit

- name: Intimidate fires on entry
  # This test found a real engine bug on 2026-08-09: BattleCommand_StatDown's
  # ability-drop marker clobbered hl, so EVERY stat drop wrote its stage into
  # wDisguiseBusted instead of the stat-level array. Fixed in
  # effect_commands.asm (.ComputerMiss push/pop hl).
  player: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:  { species: MACHAMP,  level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - enemy.stat_levels[0] == 6   # enemy attack dropped one stage

- name: Invincibility keeps party HP synchronized
  # Battle HP and party HP are separate copies. A lethal hit must restore
  # both immediately so a back-to-back scripted encounter does not see the
  # active party mon as fainted during the next battle's initialization.
  player: { species: SHUCKLE, level: 5, hp: 1, moves: [SPLASH] }
  enemy:  { species: MEW, level: 100, moves: [QUICK_ATTACK] }
  setup_wram: { wPlayerInvincibleCheat: 1 }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == 1
    - wram16('wPartyMon1HP') == 1

- name: Growl lowers attack (move-based stat drop regression)
  # Companion to the Intimidate case: the same hl-clobber bug broke plain
  # move-based drops through a different call (CheckSelfInflictedStatDrop
  # turned out hl-safe, but keep this canary for the whole StatDown path).
  player: { species: PIKACHU, level: 50, moves: [GROWL] }
  enemy:  { species: MACHAMP, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.stat_levels[0] == 6

- name: Weather override applies
  player: { species: GENGAR,  level: 50, moves: [SPLASH] }
  enemy:  { species: MACHAMP, level: 50, moves: [SPLASH] }
  weather: rain
  rng: forced_high
  turns: 1
  assert:
    - weather == 1
