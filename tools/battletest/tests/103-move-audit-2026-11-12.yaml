    wPartyMon1PP: 65
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerDisableCount') != 0", "textbox_seen('WasDisabledText')"]

- name: "Audit 1112 control: Curse fails when all three changes are capped"
  player: {species: MEW, level: 50, ability: NO_ABILITY, stages: {atk: 6, def: 6, spd: -6}, moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert: ["player.stat_levels[0] == 13", "player.stat_levels[1] == 13", "player.stat_levels[2] == 1", "textbox_seen('WontRiseAnymoreText')"]

- name: "Audit 1112 control: Contrary Curse fails when all reversed changes are capped"
  player: {species: MEW, level: 50, ability: CONTRARY, stages: {atk: -6, def: -6, spd: 6}, moves: [CURSE]}
  enemy: {species: MAGIKARP, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert: ["player.stat_levels[0] == 1", "player.stat_levels[1] == 1", "player.stat_levels[2] == 13", "textbox_seen('WontRiseAnymoreText')"]

- name: "Audit 1112 control: Gas suppresses Contrary during the Curse cap check"
  player: {species: MEW, level: 50, ability: CONTRARY, stages: {atk: 6, def: 6}, moves: [CURSE]}
  enemy: {species: WEEZING, level: 50, ability: NEUTRALIZING_GAS, moves: [SPLASH]}
  rng: forced_high
  turns: 1
