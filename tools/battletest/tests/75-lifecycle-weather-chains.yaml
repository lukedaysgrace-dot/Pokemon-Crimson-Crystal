# Gas faint -> forced replacement -> Trace -> weather, with held items.
- name: 'Lifecycle chain: player Gas EXPLOSION Trace DRIZZLE BERRY'
  player:
    species: WEEZING
    level: 30
    ability: NEUTRALIZING_GAS
    moves:
    - EXPLOSION
  enemy:
    species: POLITOED
    level: 100
    ability: DRIZZLE
    item: BERRY
    hp: 51
    moves:
    - SPLASH
  rng: forced_high
  turns: 2
  turn_assert:
  - 0 <= player.hp <= player.maxhp
