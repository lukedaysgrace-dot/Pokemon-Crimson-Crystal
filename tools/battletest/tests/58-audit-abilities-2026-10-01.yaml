# Generation 9 interaction regressions. Intentionally custom Flash Fire, Gale Wings,
# Disguise, Filter and Solid Rock behavior is preserved.

- name: "Audit abilities: Flash Fire ordinary +1 Sp Atk Fire-move control"
  id: audit_flash_fire_control
  player: { species: MEW, level: 50, ability: FLASH_FIRE, stages: { satk: 1 }, moves: [EMBER] }
  enemy: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  rng_value: 180
  turns: 1
  assert: ["enemy.hp < enemy.start_hp"]

- name: "Audit abilities: Flash Fire uses an ordinary Sp Atk boost for special Fire damage"
  player: { species: MEW, level: 50, ability: FLASH_FIRE, moves: [SPLASH, EMBER] }
  enemy: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [EMBER] }
  move_script: [1, 2]
  rng: forced_high
  rng_value: 180
  turns: 2
  assert:
    - "enemy.start_hp - enemy.hp == result('audit_flash_fire_control')['enemy']['damage']"
    - player.hp == player.start_hp
    - player.stat_levels[3] == 9
    - player.stat_levels[0] == 7

