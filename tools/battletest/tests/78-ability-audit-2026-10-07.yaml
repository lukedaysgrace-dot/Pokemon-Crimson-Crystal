# ---- Survival effects only apply to hits that reach the holder ----------
- name: "Audit 10-07: a hit on a Substitute doesn't consume a full-HP Focus Sash"
  player: { species: ALAKAZAM, level: 50, ability: NO_ABILITY, item: FOCUS_SASH, substatus: [SUBSTITUTE], moves: [SPLASH] }
  enemy:  { species: MACHAMP, level: 100, ability: NO_ABILITY, moves: [CROSS_CHOP] }
  setup_wram: { wPlayerSubstituteHP: 40 }
  rng: forced_high
  turns: 1
  assert:
    - player.item == 'FOCUS_SASH'
    - player.hp == player.start_hp

- name: "Audit 10-07: Sturdy doesn't activate for a hit on a Substitute"
  player: { species: GOLEM, level: 50, ability: STURDY, substatus: [SUBSTITUTE], moves: [SPLASH] }
  enemy:  { species: MACHAMP, level: 100, ability: NO_ABILITY, moves: [CROSS_CHOP] }
  setup_wram: { wPlayerSubstituteHP: 40 }
  rng: forced_high
  turns: 1
  assert:
    - "not ability_seen('STURDY')"
    - player.hp == player.start_hp

- name: "Audit 10-07 control: Infiltrator's hit through a Substitute meets the Sash"
  player: { species: ALAKAZAM, level: 50, ability: NO_ABILITY, item: FOCUS_SASH, substatus: [SUBSTITUTE], moves: [SPLASH] }
  enemy:  { species: MACHAMP, level: 100, ability: INFILTRATOR, moves: [CROSS_CHOP] }
  setup_wram: { wPlayerSubstituteHP: 40 }
  rng: forced_high
  turns: 1
  assert:
    - player.item == 'NO_ITEM'
    - player.hp == 1
