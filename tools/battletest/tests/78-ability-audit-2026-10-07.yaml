# ---- Unaware ignores the attacker's accuracy stages ---------------------
# forced_high rolls 180: a 50% move misses at neutral accuracy and hits at
# +6; a 100% move hits at neutral and misses at -6.
- name: "Audit 10-07 control: +6 accuracy lands a 50% move"
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [DYNAMICPUNCH], stages: { acc: 6 } }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
