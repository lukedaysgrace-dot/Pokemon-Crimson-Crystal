# Second-pass ability audit, 2026-10-07. Each fix has a reproduction case
# (failed before the fix) and, where useful, a control that pins the
# unchanged behaviour next to it. Modern reference: Pokemon Showdown's
# data/abilities.ts, data/moves.ts and sim/battle-actions.ts hit steps.

# ---- Protect / semi-invulnerability precede TryHit-stage abilities -------
# stab (absorb/immunity hooks) runs before checkhit (Protect, Fly/Dig).
- name: "Audit 10-07: Protect blocks Thunderbolt before Volt Absorb heals"
  player: { species: LANTURN, level: 50, ability: VOLT_ABSORB, hp: 50, moves: [PROTECT] }
  enemy:  { species: MAGNEMITE, level: 50, ability: NO_ABILITY, moves: [THUNDERBOLT] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp
    - "not ability_seen('VOLT_ABSORB')"

- name: "Audit 10-07 control: Volt Absorb still heals without Protect"
  player: { species: LANTURN, level: 50, ability: VOLT_ABSORB, hp: 50, moves: [SPLASH] }
  enemy:  { species: MAGNEMITE, level: 50, ability: NO_ABILITY, moves: [THUNDERBOLT] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp > player.start_hp

- name: "Audit 10-07: Volt Absorb still absorbs a move that would miss"
  # TryHit abilities resolve before the accuracy roll (Zap Cannon is 50%).
  player: { species: LANTURN, level: 50, ability: VOLT_ABSORB, hp: 50, moves: [SPLASH] }
  enemy:  { species: MAGNEMITE, level: 50, ability: NO_ABILITY, moves: [ZAP_CANNON] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp > player.start_hp

- name: "Audit 10-07: Protect blocks Thunder Wave before Volt Absorb heals"
  player: { species: LANTURN, level: 50, ability: VOLT_ABSORB, hp: 50, moves: [PROTECT] }
  enemy:  { species: MAGNEMITE, level: 50, ability: NO_ABILITY, moves: [THUNDER_WAVE] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp
    - player.status == 0

- name: "Audit 10-07: Protect blocks the move before Lightning Rod raises Sp. Atk"
  player: { species: PIKACHU, level: 50, ability: LIGHTNING_ROD, moves: [PROTECT] }
  enemy:  { species: MAGNEMITE, level: 50, ability: NO_ABILITY, moves: [THUNDERBOLT] }
  rng: forced_high
  turns: 1
  assert:
    - player.stat_levels[3] == 7

- name: "Audit 10-07: Protect blocks Flamethrower before Flash Fire activates"
  player: { species: ARCANINE, level: 50, ability: FLASH_FIRE, moves: [PROTECT] }
  enemy:  { species: MAGMAR, level: 50, ability: NO_ABILITY, moves: [FLAMETHROWER] }
  rng: forced_high
  turns: 1
  assert:
    - player.stat_levels == [7, 7, 7, 7, 7, 7, 7]

- name: "Audit 10-07: Protect blocks Spore before Sap Sipper absorbs it"
  player: { species: MILTANK, level: 50, ability: SAP_SIPPER, moves: [PROTECT] }
  enemy:  { species: PARASECT, level: 50, ability: NO_ABILITY, moves: [SPORE] }
  rng: forced_high
  turns: 1
  assert:
    - player.stat_levels[0] == 7
    - player.status == 0

- name: "Audit 10-07: a Fly user is out of reach before Volt Absorb heals"
  player: { species: PIDGEOT, level: 70, ability: VOLT_ABSORB, hp: 50, moves: [FLY] }
  enemy:  { species: MAGNEMITE, level: 20, ability: NO_ABILITY, moves: [THUNDERBOLT] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp

- name: "Audit 10-07: a Dig user is out of reach before Water Absorb heals"
  player: { species: QUAGSIRE, level: 70, ability: WATER_ABSORB, hp: 50, moves: [DIG] }
  enemy:  { species: STARYU, level: 20, ability: NO_ABILITY, moves: [WATER_GUN] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp

- name: "Audit 10-07: Levitate shows no banner against a Protecting target"
  player: { species: GENGAR, level: 50, ability: LEVITATE, moves: [PROTECT] }
  enemy:  { species: DUGTRIO, level: 50, ability: NO_ABILITY, moves: [EARTHQUAKE] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp
    - "not ability_seen('LEVITATE')"

# ---- No Guard reaches semi-invulnerable targets -------------------------
- name: "Audit 10-07 control: a Fly user dodges an ordinary attack"
  player: { species: PIDGEOT, level: 70, ability: NO_ABILITY, moves: [FLY] }
  enemy:  { species: MACHAMP, level: 20, ability: NO_ABILITY, moves: [KARATE_CHOP] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp

- name: "Audit 10-07: a No Guard attacker hits a Fly user"
  player: { species: PIDGEOT, level: 70, ability: NO_ABILITY, moves: [FLY] }
  enemy:  { species: MACHAMP, level: 20, ability: NO_GUARD, moves: [KARATE_CHOP] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp < player.start_hp

- name: "Audit 10-07: a Fly user with No Guard can be hit"
  player: { species: PIDGEOT, level: 70, ability: NO_GUARD, moves: [FLY] }
  enemy:  { species: MACHAMP, level: 20, ability: NO_ABILITY, moves: [KARATE_CHOP] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp < player.start_hp

- name: "Audit 10-07: a No Guard attacker hits a Dig user"
  player: { species: DUGTRIO, level: 70, ability: NO_ABILITY, moves: [DIG] }
  enemy:  { species: MACHAMP, level: 20, ability: NO_GUARD, moves: [KARATE_CHOP] }
  rng: forced_high
  turns: 1
  assert:
    - player.hp < player.start_hp

- name: "Audit 10-07: No Guard's hit on a Fly user applies its stat drop"
  player: { species: PIDGEOT, level: 70, ability: NO_ABILITY, moves: [FLY] }
  enemy:  { species: MACHAMP, level: 20, ability: NO_GUARD, moves: [ROCK_SMASH] }
  rng: forced_low
  turns: 1
  assert:
    - player.hp < player.start_hp
    - player.stat_levels[1] == 6

# ---- Baton Pass runs switch-out abilities ------------------------------
- name: "Audit 10-07: Regenerator heals the player's Baton Pass user"
  player:  { species: CORSOLA, level: 50, ability: REGENERATOR, hp: 50, moves: [BATON_PASS] }
  player2: { species: MEW, level: 50, moves: [SPLASH] }
  enemy:   { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'MEW'
    - wram16('wPartyMon1HP') > player.start_hp

- name: "Audit 10-07: Natural Cure cures the player's Baton Pass user"
  player:  { species: CORSOLA, level: 50, ability: NATURAL_CURE, status_byte: 8, moves: [BATON_PASS] }
  player2: { species: MEW, level: 50, moves: [SPLASH] }
  enemy:   { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'MEW'
    - wram('wPartyMon1Status') == 0

- name: "Audit 10-07: Regenerator heals the enemy's Baton Pass user"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy:  { species: CORSOLA, level: 50, ability: REGENERATOR, hp: 50, moves: [BATON_PASS] }
  enemy2: { species: MEW, level: 50, moves: [SPLASH] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy.species == 'MEW'
    - wram16('wOTPartyMon1HP') > enemy.start_hp

# ---- Transform / Imposter start the copied ability ---------------------
- name: "Audit 10-07: Transform copies Intimidate and it activates"
  player: { species: MEW, level: 50, ability: SYNCHRONIZE, moves: [TRANSFORM] }
  enemy:  { species: ARBOK, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.ability == 'INTIMIDATE'
    - enemy.stat_levels[0] == 6

- name: "Audit 10-07: Transform copies Drizzle and it summons rain"
  player: { species: MEW, level: 50, ability: SYNCHRONIZE, moves: [TRANSFORM] }
  enemy:  { species: POLITOED, level: 50, ability: DRIZZLE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  setup_wram: { wBattleWeather: 0 }
  assert:
    - player.ability == 'DRIZZLE'
    - weather == 1

- name: "Audit 10-07: copying an ability the user already has doesn't restart it"
  player: { species: MEW, level: 50, ability: INTIMIDATE, moves: [TRANSFORM] }
  enemy:  { species: ARBOK, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.ability == 'INTIMIDATE'
    - enemy.stat_levels[0] == 7

- name: "Audit 10-07: Imposter's copied Intimidate activates on entry"
  player: { species: DITTO, level: 50, ability: IMPOSTER, moves: [SPLASH] }
  enemy:  { species: ARBOK, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  rng: forced_high
  turns: 0
  assert:
    - player.ability == 'INTIMIDATE'
    - enemy.stat_levels[0] == 6

- name: "Audit 10-07: Transform does not copy a working Disguise"
  player: { species: MEW, level: 50, ability: SYNCHRONIZE, moves: [TRANSFORM, SPLASH] }
  enemy:  { species: MIMIKYU, level: 50, ability: DISGUISE, moves: [SPLASH, TACKLE] }
  rng: forced_high
  turns: 1
  assert:
    - player.ability == 'SYNCHRONIZE'

# ---- Technician uses the hit's real base power -------------------------
- name: "Audit 10-07 control: max-friendship Return without Technician"
  id: tech_return_control
  player: { species: AMBIPOM, level: 50, ability: NO_ABILITY, moves: [RETURN] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wBattleMonHappiness: 255 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp

- name: "Audit 10-07: Technician doesn't boost 102-power Return"
  player: { species: AMBIPOM, level: 50, ability: TECHNICIAN, moves: [RETURN] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wBattleMonHappiness: 255 }
