# Exact berry amounts and ability/item state across multi-turn chains.
# Start above half HP so the first hit, rather than entry, triggers recovery.
- name: 'Complex chain: player PARENTAL_BOND TACKLE NO_ABILITY berry control'
  id: complex_berry_player_PARENTAL_BOND_TACKLE_NO_ABILITY
  player:
    species: MEW
    level: 30
    ability: PARENTAL_BOND
    item: LIFE_ORB
    moves:
    - TACKLE
  enemy:
    species: OMASTAR
    level: 100
    ability: NO_ABILITY
    moves:
    - SPLASH
    hp: 51
  rng: forced_high
  turns: 1
  assert:
  - 0 <= player.hp <= player.maxhp
  - 0 <= enemy.hp <= enemy.maxhp
  - wram('wInAbility') == 0
  - (wram('wDisguiseBusted', 1) & 64) == 0
  - (player.status & 7) == 0 or (player.status & 120) == 0
  - (enemy.status & 7) == 0 or (enemy.status & 120) == 0
  - 1 <= player.stat_levels[0] <= 13
  - 1 <= player.stat_levels[1] <= 13
  - 1 <= player.stat_levels[2] <= 13
  - 1 <= player.stat_levels[3] <= 13
  - 1 <= player.stat_levels[4] <= 13
  - 1 <= player.stat_levels[5] <= 13
  - 1 <= player.stat_levels[6] <= 13
  - 1 <= enemy.stat_levels[0] <= 13
  - 1 <= enemy.stat_levels[1] <= 13
  - 1 <= enemy.stat_levels[2] <= 13
  - 1 <= enemy.stat_levels[3] <= 13
  - 1 <= enemy.stat_levels[4] <= 13
  - 1 <= enemy.stat_levels[5] <= 13
  - 1 <= enemy.stat_levels[6] <= 13
  - enemy.hp > 0
  - wram('wEnemyRageFistHits') == 2
