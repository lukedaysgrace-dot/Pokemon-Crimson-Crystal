  enemy:  { species: PIKACHU, level: 50, ability: STATIC, moves: [SPLASH] }
  rng: forced_low
  move_script: [1, 2]
  turns: 2
  assert:
    - (player.status & 64) != 0

# ---- #11 Sticky Web goes through the ability-drop wrapper ------------------

- name: "Audit 2026-08-28 #11: Sticky Web always slows the player's switch-in (no AI-miss roll) and Defiant answers it"
  # forced_low used to make the vanilla 25% computer-miss roll eat the
  # web for the player's switch-in.
  player:  { species: TAUROS,  level: 50, ability: RUN_AWAY, moves: [SPLASH] }
  player2: { species: BISHARP, level: 50, ability: DEFIANT, moves: [SPLASH] }
  enemy:   { species: GRIMER,  level: 50, moves: [STICKY_WEB] }
  rng: forced_low
  move_script: [1, "switch:2"]
  turns: 2
  assert:
    - player.species == 'BISHARP'
    - player.stat_levels[2] == 6
    - player.stat_levels[0] == 9

