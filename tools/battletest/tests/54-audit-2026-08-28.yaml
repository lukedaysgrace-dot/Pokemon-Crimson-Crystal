- name: "Audit 2026-08-28 #10: Safeguard blocks Static"
  player: { species: TAUROS,  level: 50, ability: RUN_AWAY, moves: [SAFEGUARD, TACKLE] }
  enemy:  { species: PIKACHU, level: 50, ability: STATIC, moves: [SPLASH] }
