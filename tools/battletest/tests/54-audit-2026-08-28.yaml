  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.stat_levels[0] == 7
    - player.stat_levels[1] == 6
    - player.stat_levels[4] == 6

- name: "Audit 2026-08-28 #4: Competitive does not fire on the user's own Draco Meteor drop"
