# ---- #5 Disguise's deferred bust leaking out of status moves ---------------

- name: "Audit 2026-08-28 #5: a status move does not arm Disguise; the disguise still absorbs the first hit"
  # Thunder Wave (stab, no checkfaint) used to arm the deferred bust flag;
  # Night Shade (checkfaint, no stab) then consumed it and busted Mimikyu
  # for free. With the fix Shadow Ball on turn 3 is still absorbed.
  player: { species: GENGAR,  level: 50, moves: [THUNDER_WAVE, NIGHT_SHADE, SHADOW_BALL] }
  enemy:  { species: MIMIKYU, level: 50, ability: DISGUISE, moves: [SPLASH] }
  rng: forced_high
  move_script: [1, 2, 3]
  turns: 3
  assert:
    - (enemy.status & 64) != 0
    - enemy.hp == enemy.maxhp - 50

# ---- #6 stale savemiss scope after a failed self-drop move -----------------

- name: "Audit 2026-08-28 #6: Clear Body still blocks Growl after the holder's Close Combat failed"
  # Gengar is faster. T1: Growl (blocked), Dreepy's Close Combat can't hit
  # a Ghost -> the script aborts at failuretext. T2: Growl must still be
  # blocked - the stale scope used to make it read as self-inflicted.
  player: { species: DREEPY, level: 50, ability: CLEAR_BODY, moves: [CLOSE_COMBAT] }
  enemy:  { species: GENGAR, level: 50, moves: [GROWL] }
  rng: forced_high
  turns: 2
  assert:
    - player.stat_levels[0] == 7

# ---- #7 enemy toxic bookkeeping runs against the incoming mon --------------

- name: "Audit 2026-08-28 #7: an AI switch does not carry the outgoing mon's Toxic flag onto the replacement"
  # Same convergence setup as Audit 3 (10-audit-seeds): Chansey's Tackle
  # can't touch Gengar, so the AI switches to Snorlax within 4 turns.
  # Chansey is badly poisoned (slot bit set); Snorlax must arrive without
  # SUBSTATUS_TOXIC.
  player:  { species: GENGAR,  level: 50, moves: [SPLASH] }
  enemy:   { species: CHANSEY, level: 50, status_byte: 8, substatus: [TOXIC], moves: [TACKLE] }
  enemy2:  { species: SNORLAX, level: 50, moves: [SHADOW_BALL] }
  setup_wram: { wEnemyToxicSlots: 1 }
  rng: seeded
  turns: 4
  assert:
    - enemy.species == 'SNORLAX'
    - (enemy.substatus[4] & 1) == 0

# ---- #8 multi-hit moves stop when the attacker is KO'd mid-loop ------------

- name: "Audit 2026-08-28 #8 control: Fury Swipes hit count under this seed"
  id: fury_control
  player:  { species: PERSIAN,    level: 50, moves: [FURY_SWIPES] }
  enemy:   { species: AGGRON,     level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: seeded
  rng_value: 3
  turns: 1
  assert:
    - enemy.hp < enemy.maxhp

- name: "Audit 2026-08-28 #8: Fury Swipes stops after Iron Barbs KOs the attacker"
  # Persian at 20% loses 1/8 per hit to Iron Barbs: it drops to 0 on hit 2
  # and must not land hits 3+. Same seed as the control, so the control's
  # full-count damage is the upper bound the test must stay strictly under.
  player:  { species: PERSIAN,    level: 50, hp: 20, moves: [FURY_SWIPES] }
  player2: { species: SNORLAX,    level: 50, moves: [SPLASH] }
  enemy:   { species: AGGRON,     level: 50, ability: IRON_BARBS, moves: [SPLASH] }
  rng: seeded
  rng_value: 3
  turns: 1
  assert:
    - wram16('wPartyMon1HP') == 0
    - enemy.maxhp - enemy.hp < result('fury_control')['enemy']['damage']

# ---- #9 Heal Bell clears the Toxic bookkeeping ------------------------------

- name: "Audit 2026-08-28 #9: Heal Bell clears SUBSTATUS_TOXIC, the counter and the slot bits"
  player: { species: MILTANK, level: 50, status_byte: 8, substatus: [TOXIC], moves: [HEAL_BELL] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  setup_wram: { wPlayerToxicSlots: 1, wPlayerToxicCount: 3 }
  rng: forced_high
  turns: 1
  assert:
    - player.status == 0
    - (player.substatus[4] & 1) == 0
    - wram('wPlayerToxicCount') == 0
    - wram('wPlayerToxicSlots') == 0

