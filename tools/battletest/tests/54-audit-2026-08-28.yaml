- name: "Audit 2026-08-28 #4: Defiant does not fire on a non-Ghost Curse's Speed drop"
  player: { species: BISHARP, level: 50, ability: DEFIANT, moves: [CURSE] }
  enemy:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - player.stat_levels[0] == 8
    - player.stat_levels[1] == 8
    - player.stat_levels[2] == 6

- name: "Audit 2026-08-28 #4 control: Defiant still answers an opponent's Growl"
  player: { species: BISHARP, level: 50, ability: DEFIANT, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, moves: [GROWL] }
  rng: forced_high
  turns: 1
