# ---- #14 Magic Bounce vs status moves --------------------------------------

- name: "Audit 2026-08-28 #14: Magic Bounce reflects Will-O-Wisp from behind its own Substitute"
  player: { species: GENGAR, level: 50, moves: [WILL_O_WISP] }
  enemy:  { species: ESPEON, level: 50, ability: MAGIC_BOUNCE, substatus: [SUBSTITUTE], moves: [SPLASH] }
  setup_wram: { wEnemySubstituteHP: 255 }
  rng: forced_high
  turns: 1
  assert:
    - (player.status & 16) != 0
    - enemy.status == 0

- name: "Audit 2026-08-28 #14: an enemy Toxic is bounced before the AI 25% fail roll"
  # forced_low makes the vanilla AI roll fail; the bounce must come first.
  player: { species: ESPEON,  level: 50, ability: MAGIC_BOUNCE, moves: [SPLASH] }
  enemy:  { species: RATTATA, level: 50, moves: [TOXIC] }
  rng: forced_low
  turns: 1
  assert:
    - (enemy.status & 8) != 0
    - (enemy.substatus[4] & 1) != 0
    - player.status == 0

