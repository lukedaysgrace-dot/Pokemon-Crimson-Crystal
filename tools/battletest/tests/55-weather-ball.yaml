  rng: forced_high
  turns: 1
  assert:
    - wram('wPlayerMoveStructPower') == 100
    - wram('wPlayerMoveStructType') == 5

- name: "Weather Ball: hail is 100-power Ice"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  enemy:  { species: WALREIN, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
