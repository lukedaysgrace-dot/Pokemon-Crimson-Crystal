    - wram('wPlayerMoveStructType') == 25

# ---- weather-setting and suppressing abilities -------------------------
- name: "Weather Ball: Drizzle supplies the rain form"
  player: { species: POLITOED, level: 50, ability: DRIZZLE, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - weather == 1
    - wram('wPlayerMoveStructPower') == 100
    - wram('wPlayerMoveStructType') == 21

- name: "Weather Ball: Drought supplies the sun form"
  player: { species: VULPIX, level: 50, ability: DROUGHT, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - weather == 2
    - wram('wPlayerMoveStructType') == 20

- name: "Weather Ball: Sand Stream supplies the Rock form"
  player: { species: TYRANITAR, level: 50, ability: SAND_STREAM, moves: [WEATHER_BALL] }
  enemy:  { species: STEELIX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - weather == 3
    - wram('wPlayerMoveStructType') == 5

- name: "Weather Ball: Snow Warning supplies the Ice form"
  player: { species: ABOMASNOW, level: 50, ability: SNOW_WARNING, moves: [WEATHER_BALL] }
  enemy:  { species: WALREIN, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - weather == 4
    - wram('wPlayerMoveStructType') == 25

- name: "Weather Ball: Cloud Nine suppresses weather into the Normal form"
  player: { species: GOLDUCK, level: 50, ability: CLOUD_NINE, moves: [WEATHER_BALL] }
  enemy:  { species: POLITOED, level: 100, ability: DRIZZLE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - weather_raw == 129
    - wram('wPlayerMoveStructPower') == 50
    - wram('wPlayerMoveStructType') == 0

- name: "Weather Ball: Neutralizing Gas turns off Cloud Nine suppression"
  player: { species: GOLDUCK, level: 50, ability: CLOUD_NINE, moves: [WEATHER_BALL] }
  enemy:  { species: KOFFING, level: 100, ability: NEUTRALIZING_GAS, moves: [SPLASH] }
  weather: rain
  rng: forced_high
  turns: 1
  assert:
    - weather_raw == 1
    - wram('wPlayerMoveStructPower') == 100
    - wram('wPlayerMoveStructType') == 21

- name: "Weather Ball: same-turn Sunny Day changes a slower foe's form"
  player: { species: MEWTWO, level: 50, ability: NO_ABILITY, moves: [SUNNY_DAY] }
  enemy:  { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  rng: forced_high
  turns: 1
  assert:
    - weather == 2
    - wram('wEnemyMoveStructPower') == 100
    - wram('wEnemyMoveStructType') == 20

# Mega Sol is a custom ability in this game whose documented contract is that
# the user's moves act as if harsh sun is active.
- name: "Weather Ball: Mega Sol supplies its personal sun form"
  player: { species: MEGANIUM, level: 50, ability: MEGA_SOL, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - weather == 0
    - wram('wPlayerMoveStructPower') == 100
    - wram('wPlayerMoveStructType') == 20

- name: "Weather Ball: Mega Sol overrides real rain for its user"
  player: { species: MEGANIUM, level: 50, ability: MEGA_SOL, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
