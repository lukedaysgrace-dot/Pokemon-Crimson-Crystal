  rng: forced_high
  turns: 1
  assert:
    - wram('wPlayerMoveStructPower') == 100
    - wram('wPlayerMoveStructType') == 20

- name: "Weather Ball: sandstorm is 100-power Rock"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  enemy:  { species: STEELIX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
