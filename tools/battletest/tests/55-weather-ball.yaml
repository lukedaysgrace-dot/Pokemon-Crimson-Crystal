# ---- AI -----------------------------------------------------------------
- name: "Weather Ball: trainer AI recognizes the live rain form"
  player:  { species: GOLEM, level: 100, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy:   { species: MEW, level: 50, ability: NO_ABILITY, moves: [TACKLE, WEATHER_BALL] }
  enemy2:  { species: MEW, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  enemy_class: FALKNER
  weather: rain
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'WEATHER_BALL'
