# Weather Ball: live weather resolution, animation parameter inputs, and every
# type/power-sensitive ability class present in Crimson Crystal.

# ---- core forms ---------------------------------------------------------
- name: "Weather Ball: clear weather is 50-power Normal"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wPlayerMoveStructPower') == 50
    - wram('wPlayerMoveStructType') == 0
    - enemy.hp < enemy.start_hp

- name: "Weather Ball: rain is 100-power Water"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  weather: rain
  rng: forced_high
  turns: 1
  assert:
    - wram('wPlayerMoveStructPower') == 100
    - wram('wPlayerMoveStructType') == 21

- name: "Weather Ball: sun is 100-power Fire"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
