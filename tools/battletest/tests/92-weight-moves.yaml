- name: "Low Kick: 199.0 kg Ho-Oh -> 100 power"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: HO_OH, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
