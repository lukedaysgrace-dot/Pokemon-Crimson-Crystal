# ---- Minimize: double damage and no accuracy check (Gen VI+) -----------
- name: "Heavy Slam control: normal damage"
  id: weight_slam_minimize_control
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAVY_SLAM] }
  enemy: { species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp

- name: "Heavy Slam: doubled against a minimized target"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAVY_SLAM] }
  enemy: { species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wEnemyMinimized: 1 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.start_hp - enemy.hp == 2 * (result('weight_slam_minimize_control')['enemy']['damage'])

- name: "Heavy Slam control: +6 evasion makes the slam miss"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAVY_SLAM] }
  enemy: { species: MEW, level: 100, ability: NO_ABILITY, stages: { eva: 6 }, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == enemy.start_hp

- name: "Heavy Slam: never misses a minimized target"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAVY_SLAM] }
  enemy: { species: MEW, level: 100, ability: NO_ABILITY, stages: { eva: 6 }, moves: [SPLASH] }
  setup_wram: { wEnemyMinimized: 1 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp

- name: "Heat Crash: never misses a minimized player either"
  player: { species: MEW, level: 100, ability: NO_ABILITY, stages: { eva: 6 }, moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAT_CRASH] }
  setup_wram: { wPlayerMinimized: 1 }
  rng: forced_high
  turns: 1
  assert:
    - player.hp < player.start_hp

- name: "Heavy Slam: Protect still blocks it against a minimized target"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAVY_SLAM] }
  enemy: { species: MEW, level: 100, ability: NO_ABILITY, moves: [PROTECT] }
  setup_wram: { wEnemyMinimized: 1 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == enemy.start_hp

- name: "Low Kick: Minimize doesn't double it"
  id: weight_lowkick_minimize_check
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wEnemyMinimized: 1 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == result('weight_lowkick_heavy_control')['enemy']['hp']

# ---- Heat Crash ---------------------------------------------------------
- name: "Heat Crash: weight ratio power, no burn chance"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [HEAT_CRASH] }
  enemy: { species: PICHU, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 120
    - enemy.hp < enemy.start_hp
    - enemy.status == 0

- name: "Heat Crash: 13.0 kg vs 6.5 kg (exactly 2x) -> 60 power"
  player: { species: IVYSAUR, level: 50, ability: NO_ABILITY, moves: [HEAT_CRASH] }
  enemy: { species: KRABBY, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 60

# ---- Trainer AI predicts the weight-based power ------------------------
- name: "AI: picks a 120-power Heavy Slam over Tackle"
  # Shuckle (20.5 kg) survives either move, so the choice is about power.
  player: { species: SHUCKLE, level: 100, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [TACKLE, HEAVY_SLAM] }
  enemy2: { species: PIDGEY, level: 50, moves: [TACKLE] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'HEAVY_SLAM'

- name: "AI: prefers Tackle when Heavy Slam would be 40 power"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy: { species: PICHU, level: 50, ability: NO_ABILITY, moves: [HEAVY_SLAM, TACKLE] }
  enemy2: { species: PIDGEY, level: 50, moves: [TACKLE] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'TACKLE'

- name: "AI: picks a 120-power Low Kick over Tackle"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, moves: [TACKLE, LOW_KICK] }
  enemy2: { species: PIDGEY, level: 50, moves: [TACKLE] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'LOW_KICK'
