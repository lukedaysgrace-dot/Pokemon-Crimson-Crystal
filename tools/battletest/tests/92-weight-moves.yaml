# Weight-based moves: Low Kick, Grass Knot, Heavy Slam and Heat Crash.
#
# Powers follow Showdown's basePowerCallback code (data/moves.ts), using the
# official weights in hectograms (tools/testdata/species_weights.json):
#   Low Kick / Grass Knot (target): >=2000 120, >=1000 100, >=500 80,
#                                   >=250 60, >=100 40, else 20
#   Heavy Slam / Heat Crash (user vs target): >=5x 120, >=4x 100, >=3x 80,
#                                   >=2x 60, else 40
# wDamageCalcBasePower holds the power damagecalc used for the last hit.
# tools/battletest/weight_checks.py checks every species' native weight.

# ---- Low Kick thresholds (exact boundary weights) -----------------------
- name: "Low Kick: 9.9 kg Metapod -> 20 power"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: METAPOD, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 20
    - enemy.hp < enemy.start_hp

- name: "Low Kick: 10.0 kg Kakuna -> 40 power"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: KAKUNA, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 40

- name: "Low Kick: 25.0 kg Seadra -> 60 power"
