- name: "Low Kick: 200.5 kg Scolipede -> 120 power"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: SCOLIPEDE, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 120

- name: "Low Kick: enemy side uses the player's weight"
  player: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 120
    - player.hp < player.start_hp

- name: "Low Kick: no longer flinches (the slower target still moves)"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [GROWL] }
  rng: forced_low
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp
    - player.stat_levels[0] == 6

- name: "Low Kick: a transformed Pokemon has its new form's weight"
  # Ditto (4.0 kg) transforms into Snorlax (460.0 kg) before the kick.
  player: { species: DITTO, level: 50, ability: NO_ABILITY, moves: [TRANSFORM] }
  enemy: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  rng: forced_high
  turns: 1
  assert:
    - player.species == 'SNORLAX'
    - wram('wDamageCalcBasePower') == 120

# ---- Technician sees the computed power -------------------------------
- name: "Low Kick control: 20 power without Technician"
  id: weight_lowkick_light_control
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: PICHU, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 20

- name: "Low Kick: Technician boosts a 20-power kick"
  player: { species: MEW, level: 50, ability: TECHNICIAN, moves: [LOW_KICK] }
  enemy: { species: PICHU, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < result('weight_lowkick_light_control')['enemy']['hp']

- name: "Low Kick control: 120 power without Technician"
  id: weight_lowkick_heavy_control
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [LOW_KICK] }
  enemy: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wDamageCalcBasePower') == 120

- name: "Low Kick: Technician ignores a 120-power kick"
  player: { species: MEW, level: 50, ability: TECHNICIAN, moves: [LOW_KICK] }
  enemy: { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == result('weight_lowkick_heavy_control')['enemy']['hp']

