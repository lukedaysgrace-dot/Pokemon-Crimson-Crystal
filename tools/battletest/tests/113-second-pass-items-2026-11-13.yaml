  enemy: { species: MEW, level: 50, ability: NO_ABILITY, item: THROAT_SPRAY, moves: [HYPER_VOICE], stages: { satk: 6 } }
  rng: forced_high
  turns: 1
  assert: [enemy.item == 'THROAT_SPRAY', player.hp == player.start_hp]

- name: "Second item pass: player capped Throat Spray remains suppressed by Sheer Force"
  player: { species: MEW, level: 50, ability: SHEER_FORCE, item: THROAT_SPRAY, moves: [BUG_BUZZ], stages: { satk: 6 } }
  enemy: { species: BLISSEY, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: [player.item == 'THROAT_SPRAY', enemy.hp < enemy.start_hp]

- name: "Second item pass: enemy capped Throat Spray remains suppressed by Sheer Force"
  player: { species: BLISSEY, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  enemy: { species: MEW, level: 50, ability: SHEER_FORCE, item: THROAT_SPRAY, moves: [BUG_BUZZ], stages: { satk: 6 } }
  rng: forced_high
  turns: 1
  assert: [enemy.item == 'THROAT_SPRAY', player.hp < player.start_hp]

- name: "Second item pass: player capped Throat Spray records per-slot Recycle history"
  player: { species: MEW, level: 50, ability: NO_ABILITY, item: THROAT_SPRAY, moves: [HYPER_VOICE, RECYCLE], stages: { satk: 6 } }
  enemy: { species: BLISSEY, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  move_script: [1, 2]
  rng: forced_high
  turns: 2
  assert:
    - player.item == 'THROAT_SPRAY'
    - wram('wPlayerRecycleItems') == 0
    - wram('wPartyMon1Item') == wram('wBattleMonItem')
    - textbox_seen('BattleRecycle_Core.restored')
