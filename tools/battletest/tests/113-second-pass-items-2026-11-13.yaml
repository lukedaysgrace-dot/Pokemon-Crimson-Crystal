  turns: 1
  assert: [enemy.item == 'NO_ITEM', 'enemy.stat_levels[3] == 13']

- name: "Second item pass: player capped Throat Spray does not activate into Protect"
  player: { species: MEW, level: 50, ability: NO_ABILITY, item: THROAT_SPRAY, moves: [HYPER_VOICE], stages: { satk: 6 } }
  enemy: { species: BLISSEY, level: 100, ability: NO_ABILITY, moves: [PROTECT] }
  rng: forced_high
  turns: 1
  assert: [player.item == 'THROAT_SPRAY', enemy.hp == enemy.start_hp]

- name: "Second item pass: enemy capped Throat Spray does not activate into Protect"
  player: { species: BLISSEY, level: 100, ability: NO_ABILITY, moves: [PROTECT] }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, item: THROAT_SPRAY, moves: [HYPER_VOICE], stages: { satk: 6 } }
  rng: forced_high
  turns: 1
  assert: [enemy.item == 'THROAT_SPRAY', player.hp == player.start_hp]

