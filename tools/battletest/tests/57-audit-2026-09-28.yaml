# Regressions from the 2026-09-28 code audit.

- name: "Audit 09-28: Roar forces a trainer's mon out (cross-bank FindAliveEnemyMons)"
  player:  { species: MEW, level: 50, moves: [ROAR] }
  enemy:   { species: MEW, level: 50, moves: [SPLASH] }
  enemy2:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: seeded
  rng_value: 7
  turns: 1
  assert:
    - enemy.species == 'SNORLAX'

- name: "Audit 09-28: Whirlwind forces a trainer's mon out"
  player:  { species: MEW, level: 50, moves: [WHIRLWIND] }
  enemy:   { species: MEW, level: 50, moves: [SPLASH] }
  enemy2:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: seeded
  rng_value: 7
  turns: 1
  assert:
    - enemy.species == 'SNORLAX'

# Enemy gender comes from wEnemyMonShinyGenderFlags (GetGender's WILDMON path);
# Attract, Cute Charm and Rivalry used to read a stale wTempMonUnused byte.
# (The battle mon's second Status byte mirrors the party mon's gender flags.)
- name: "Audit 09-28: Attract infatuates an opposite-gender 50/50 foe"
  player: { species: PIKACHU, level: 50, ability: NO_ABILITY, moves: [ATTRACT] }
  enemy:  { species: PIKACHU, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wPartyMon1Unused: 64, wBattleMonStatus: [0, 64], wEnemyMonShinyGenderFlags: 0, wTempMonUnused: 64 }
  rng: forced_low
  turns: 1
  assert: ["(enemy.substatus[0] & 128) != 0"]

- name: "Audit 09-28: Attract fails on a same-gender 50/50 foe"
  player: { species: PIKACHU, level: 50, ability: NO_ABILITY, moves: [ATTRACT] }
  enemy:  { species: PIKACHU, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wPartyMon1Unused: 64, wBattleMonStatus: [0, 64], wEnemyMonShinyGenderFlags: 64, wTempMonUnused: 0 }
  rng: forced_low
  turns: 1
  assert: ["(enemy.substatus[0] & 128) == 0"]

# LoadEnemyMon only copied the first Status byte of a trainer's mon, so
# UpdateEnemyMonInParty wrote 0 over the party struct's shiny/gender flags
# (MON_UNUSED) after every move - a male mon came back in as female.
- name: "Audit 09-29: trainer mon keeps its gender flags through a turn"
  player:  { species: MEW, level: 50, moves: [SPLASH] }
  enemy:   { species: PIKACHU, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  enemy2:  { species: SNORLAX, level: 50, moves: [SPLASH] }
  rng: seeded
  rng_value: 7
  turns: 1
  assert:
    - "wram('wEnemyMonStatus', 1) == wram('wEnemyMonShinyGenderFlags')"
    - "wram('wOTPartyMon1Unused') == wram('wEnemyMonShinyGenderFlags')"
    - "wram('wEnemyMonShinyGenderFlags') & 64 == 64"

# Perish Song's ability farcall clobbered hl, so the user's side never got
# SUBSTATUS_PERISH (only the count), and the player never actually perished.
- name: "Audit 09-29: Perish Song marks both sides"
  player: { species: GENGAR, level: 50, ability: NO_ABILITY, moves: [PERISH_SONG] }
  enemy:  { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - "(wram('wPlayerSubStatus1') & 16) != 0"
    - "(wram('wEnemySubStatus1') & 16) != 0"

- name: "Audit 09-29: Perish Song from the enemy marks both sides"
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  enemy:  { species: GENGAR, level: 50, ability: NO_ABILITY, moves: [PERISH_SONG] }
  rng: forced_high
  turns: 1
  assert:
    - "(wram('wPlayerSubStatus1') & 16) != 0"
    - "(wram('wEnemySubStatus1') & 16) != 0"

# Sacred Sword only ignored Defense stages on the rare unboosted-crit path.
- name: "Audit 09-29: Sacred Sword control"
  id: sacred_sword_control
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SACRED_SWORD] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["enemy.hp < enemy.start_hp"]

- name: "Audit 09-29: Sacred Sword ignores +6 Defense"
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [SACRED_SWORD] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH], stages: { def: 6 } }
  rng: forced_high
  turns: 1
  assert: ["enemy.start_hp - enemy.hp == result('sacred_sword_control')['enemy']['damage']"]

# Brick Break used to shatter the screens before checkhit, even into Protect.
- name: "Audit 09-29: Brick Break control (no Reflect)"
  id: brick_break_control
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [BRICK_BREAK] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["enemy.hp < enemy.start_hp"]

- name: "Audit 09-29: Brick Break shatters Reflect and ignores it"
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [BRICK_BREAK] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wEnemyScreens: 16, wEnemyReflectCount: 5 }
  rng: forced_high
  turns: 1
  assert:
    - "(wram('wEnemyScreens') & 16) == 0"
    - "enemy.start_hp - enemy.hp == result('brick_break_control')['enemy']['damage']"

- name: "Audit 09-29: Brick Break into Protect leaves Reflect up"
  player: { species: MACHAMP, level: 50, ability: NO_ABILITY, moves: [BRICK_BREAK] }
  enemy:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [PROTECT] }
  setup_wram: { wEnemyScreens: 16, wEnemyReflectCount: 5 }
  rng: forced_high
  turns: 1
  assert:
    - "enemy.hp == enemy.start_hp"
    - "(wram('wEnemyScreens') & 16) != 0"

# Shell Side Arm picked its category from unmodified stats.
- name: "Audit 09-29: Shell Side Arm stays special without boosts"
  player: { species: ALAKAZAM, level: 50, ability: NO_ABILITY, moves: [SHELLSIDEARM] }
  enemy:  { species: SHUCKLE, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerMoveStructCategory') == 1"]

- name: "Audit 09-29: Shell Side Arm turns physical at +6 Attack"
  player: { species: ALAKAZAM, level: 50, ability: NO_ABILITY, moves: [SHELLSIDEARM], stages: { atk: 6 } }
  enemy:  { species: SHUCKLE, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerMoveStructCategory') == 0"]

# Paralysis halves Speed now, but Quick Feet still undid a quarter (x4),
# ending at x3 instead of x1.5.
- name: "Audit 09-29: Quick Feet under paralysis is x1.5, not x3"
  player: { species: URSARING, level: 50, ability: QUICK_FEET, status_byte: 64, moves: [TACKLE] }
  enemy:  { species: JOLTEON, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["wram('wEnemyGoesFirst') == 1"]

# Unnerve only printed its banner.
- name: "Audit 09-29: Unnerve stops the foe eating its Berry"
  player: { species: MEWTWO, level: 50, ability: UNNERVE, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 30, item: BERRY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["enemy.item == 'BERRY'", "enemy.hp == enemy.start_hp"]

- name: "Audit 09-29: without Unnerve the foe eats its Berry"
  player: { species: MEW, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  enemy:  { species: SNORLAX, level: 50, ability: NO_ABILITY, hp: 30, item: BERRY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["enemy.item == 'NO_ITEM'", "enemy.hp == (enemy.maxhp * 30) // 100 + 10"]

# A Berry eaten mid-turn (right after a hit) was replayed by Cud Chew at the
# end of that same turn.
- name: "Audit 09-29: Cud Chew control"
  id: cud_control
  player: { species: FARIGIRAF, level: 50, ability: NO_ABILITY, hp: 60, item: BERRY, moves: [SPLASH] }
  enemy:  { species: MEW, level: 50, ability: NO_ABILITY, moves: [TACKLE] }
  rng: forced_high
  turns: 1

- name: "Audit 09-29: Cud Chew doesn't replay a mid-turn Berry the same turn"
  player: { species: FARIGIRAF, level: 50, ability: CUD_CHEW, hp: 60, item: BERRY, moves: [SPLASH] }
  enemy:  { species: MEW, level: 50, ability: NO_ABILITY, moves: [TACKLE] }
  rng: forced_high
  turns: 1
  assert: ["player.hp == result('cud_control')['player']['hp']"]

# Klutz skipped the Mean Look / binding checks along with the Smoke Ball one.
- name: "Audit 09-29: Klutz doesn't escape Mean Look"
  player: { species: GEODUDE, level: 100, ability: KLUTZ, moves: [SPLASH] }
  enemy:  { species: RATTATA, level: 2, ability: NO_ABILITY, moves: [SPLASH] }
  setup_wram: { wEnemySubStatus5: 128 }
  move_script: [run]
  rng: forced_high
  turns: 1
  assert: ["wram('wBattleResult') == 0"]

# The sleep counter is decremented before the "still asleep?" check and the
# mon acts on the turn it hits 0, so the 1-3 roll gave 0-2 turns of sleep.
- name: "Audit 09-29: a 1-turn sleep still costs the target its next turn"
  player: { species: TAUROS, level: 50, ability: RUN_AWAY, moves: [TACKLE] }
  enemy:  { species: PARAS, level: 50, ability: NO_ABILITY, moves: [SPORE] }
  rng: forced
  rng_value: 80
  turns: 2
  assert: ["player.start_pp[0] - player.pp[0] == 1"]

# Mirror Move didn't re-resolve a copied Weather Ball (stayed Normal/50).
- name: "Audit 09-29: Mirror Move resolves a copied Weather Ball"
  player: { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [MIRROR_MOVE] }
  enemy:  { species: GENGAR, level: 50, ability: NO_ABILITY, moves: [WEATHER_BALL] }
  weather: rain
  rng: forced_high
  turns: 1
  assert: ["enemy.hp < enemy.start_hp"]

# A multi-hit attacker knocked out by Iron Barbs on hit 1 still landed hit 2.
- name: "Audit 09-29: Double Kick control"
  id: dk_control
  player: { species: PERSIAN, level: 50, ability: NO_ABILITY, moves: [DOUBLE_KICK] }
  enemy:  { species: AGGRON, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1

- name: "Audit 09-29: Double Kick stops after Iron Barbs KOs the attacker on hit 1"
  player:  { species: PERSIAN, level: 50, ability: NO_ABILITY, hp: 5, moves: [DOUBLE_KICK] }
  player2: { species: SNORLAX, level: 50, moves: [SPLASH] }
  enemy:   { species: AGGRON, level: 50, ability: IRON_BARBS, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - "wram16('wPartyMon1HP') == 0"
    - "enemy.maxhp - enemy.hp < result('dk_control')['enemy']['damage']"

# Baton Pass rebuilt the incoming mon's stats from the unmodified ones,
# dropping its paralysis Speed halving (and burn / badge adjustments).
- name: "Audit 09-30: Baton Pass keeps the incoming mon's paralysis Speed drop"
  player:  { species: SMEARGLE, level: 50, ability: NO_ABILITY, moves: [BATON_PASS] }
  player2: { species: JOLTEON, level: 50, ability: NO_ABILITY, status_byte: 64, moves: [SPLASH] }
  enemy:   { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - "player.species == 'JOLTEON'"
    - "player.stats['speed'] * 2 <= wram16('wPlayerSpeed') + 1"

# The player's Baton Pass passed the passer's Yawn drowsiness on.
- name: "Audit 09-30: Baton Pass doesn't pass Yawn drowsiness"
  player:  { species: TAUROS, level: 50, ability: RUN_AWAY, moves: [SPLASH, BATON_PASS] }
  player2: { species: MILTANK, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  enemy:   { species: RATTATA, level: 50, ability: NO_ABILITY, moves: [YAWN] }
  rng: forced_high
  move_script: [1, 2]
  turns: 2
  assert:
    - "player.species == 'MILTANK'"
    - "player.status == 0"

# After a double KO the player's replacement entered while the foe's slot was
# empty, so its Intimidate (Trace, Download, ...) was skipped.
- name: "Audit 09-30: double KO replacement still Intimidates the foe's replacement"
  player:  { species: ELECTRODE, level: 50, ability: NO_ABILITY, moves: [EXPLOSION] }
  player2: { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  enemy:   { species: RATTATA, level: 5, ability: NO_ABILITY, moves: [SPLASH] }
  enemy2:  { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - "player.species == 'GYARADOS'"
    - "enemy.species == 'SNORLAX'"
    - "enemy.stat_levels[0] == 6"

# Status-curing abilities only ran on entry, so a status that got past them
# (Mold Breaker) stuck until the mon switched out.
- name: "Audit 09-30: Limber cures a Mold Breaker paralysis at the end of the turn"
  player: { species: PINSIR, level: 50, ability: MOLD_BREAKER, moves: [THUNDER_WAVE] }
  enemy:  { species: HITMONLEE, level: 50, ability: LIMBER, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert: ["(enemy.status & 64) == 0"]

- name: "Audit r18: Pressure does not drain extra PP from a self-targeting move"
  player: { species: MEW, level: 50, moves: [SWORDS_DANCE] }
  enemy:  { species: AERODACTYL, level: 50, ability: PRESSURE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["player.start_pp[0] - player.pp[0] == 1"]

- name: "Audit r18: Pressure still drains extra PP from a targeted status move"
  player: { species: MEW, level: 50, moves: [GROWL] }
  enemy:  { species: AERODACTYL, level: 50, ability: PRESSURE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["player.start_pp[0] - player.pp[0] == 2"]

- name: "Audit r18: Life Orb recoil applies when the hit lands on a Substitute"
  player: { species: SNORLAX, level: 50, item: LIFE_ORB, moves: [TACKLE] }
  enemy:  { species: JOLTEON, level: 50, moves: [SUBSTITUTE] }
  rng: forced_high
  turns: 1
  assert: ["player.start_hp - player.hp == player.maxhp // 10"]

- name: "Audit r18: Life Orb recoil once for a multi-hit move into a Substitute"
  player: { species: SNORLAX, level: 50, item: LIFE_ORB, moves: [DOUBLE_KICK] }
  enemy:  { species: JOLTEON, level: 50, moves: [SUBSTITUTE] }
  rng: forced_high
  turns: 1
  assert: ["player.start_hp - player.hp == player.maxhp // 10"]

- name: "Audit r23: KO'ing an enemy doesn't corrupt pending Future Sight damage"
  # The exp code backed up 8 bytes into a 7-byte buffer, writing the fainted
  # mon's shiny/gender flags over wPlayerFutureSightDamage's high byte.
  player:  { species: MEW, level: 100, ability: NO_ABILITY, moves: [FUTURE_SIGHT, SURF] }
  enemy:   { species: MAGIKARP, level: 5, ability: NO_ABILITY, moves: [SPLASH] }
  enemy2:  { species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH] }
  move_script: [1, 2, 1, 1]
  rng: forced_high
  turns: 2
  assert: ["wram16('wPlayerFutureSightDamage') <= 999"]

- name: "Audit r24: Cursed Body disables the calling move's slot (Mirror Move), not the called move"
  # The AI scans wEnemyMonMoves for wEnemyDisabledMove; a move outside the
  # moveset made that scan run off and write into unrelated WRAM.
  player:  { species: GENGAR, level: 50, ability: CURSED_BODY, moves: [SURF] }
  enemy:   { species: CHANSEY, level: 50, ability: NO_ABILITY, moves: [MIRROR_MOVE] }
  enemy2:  { species: SNORLAX, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  rng: forced_low
  turns: 1
  assert:
    - "wram('wEnemyDisableCount') != 0"
    - "wram('wEnemyDisabledMove') == wram('wEnemyMonMoves')"

- name: "Audit r25: Neutralizing Gas leaving lets the foe's Intimidate activate"
  player:  { species: WEEZING_GALARIAN, level: 50, ability: NEUTRALIZING_GAS, moves: [SPLASH] }
  player2: { species: SNORLAX, level: 50, ability: THICK_FAT, moves: [SPLASH] }
  enemy:   { species: GYARADOS, level: 50, ability: INTIMIDATE, moves: [SPLASH] }
  move_script: ["switch:2"]
  rng: forced_high
  turns: 1
  assert: ["player.stat_levels[0] == 6"]


- name: "Audit r27: Unnerve stops a MysteryBerry from restoring PP"
  player: { species: MEW, level: 50, item: MYSTERYBERRY, moves: [TACKLE] }
  enemy:  { species: SNORLAX, level: 100, ability: UNNERVE, moves: [SPLASH] }
  setup_wram:
    wBattleMonPP: [1, 0, 0, 0]
    wPartyMon1PP: [1, 0, 0, 0]
  rng: forced_high
  turns: 1
  assert:
    - player.item == 'MYSTERYBERRY'

- name: "Audit r27: a fainted Unnerve holder no longer blocks the foe's Berry"
  player: { species: SNORLAX, level: 5, ability: IRON_BARBS, item: BERRY, hp: 35, moves: [SPLASH] }
  enemy:  { species: JOLTEON, level: 5, ability: UNNERVE, hp: 1, moves: [TACKLE] }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == 0
    - player.item == 'NO_ITEM'
    - player.hp > 0

- name: "Audit r28: Sheer Force still cancels Life Orb recoil when the hit breaks a Substitute"
  player: { species: NIDOKING, level: 50, ability: SHEER_FORCE, item: LIFE_ORB, moves: [BODY_SLAM] }
  enemy:  { species: JOLTEON, level: 50, moves: [SUBSTITUTE] }
  rng: forced_high
  turns: 1
  assert:
    - "player.hp == player.start_hp"

- name: "Audit r28: Pressure doesn't drain extra PP from Destiny Bond"
  player: { species: MEW, level: 50, moves: [DESTINY_BOND] }
  enemy:  { species: AERODACTYL, level: 50, ability: PRESSURE, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert: ["player.start_pp[0] - player.pp[0] == 1"]

- name: "Audit r28: Pressure doesn't drain extra PP from Conversion 2"
  player: { species: PORYGON2, level: 50, moves: [CONVERSION2] }
  enemy:  { species: AERODACTYL, level: 50, ability: PRESSURE, moves: [TACKLE] }
  # Conversion 2 rerolls types until one resists the foe's last move; a fixed
  # forced RNG value can loop forever, so use a seeded stream (as the sweep does)
  rng: seeded
  rng_value: 0xE4
  turns: 1
  assert: ["player.start_pp[0] - player.pp[0] == 1"]
