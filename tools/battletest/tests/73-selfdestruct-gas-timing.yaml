- name: "Gas explosion timing: Drizzle resumes after faint player"
  player: {"species":"WEEZING","level":30,"ability":"NEUTRALIZING_GAS","moves":["EXPLOSION"]}
  enemy: {"species":"POLITOED","level":100,"ability":"DRIZZLE","moves":["SPLASH"]}
  rng: forced_low
  turns: 1
  assert: ["weather == 1", "player.hp == 0", "enemy.hp > 0", "wram('wSelfdestructGasTurn') == 0"]

