# Gas suppresses the committed explosion hit, then ends before later actions.

- name: "Gas explosion timing: SELFDESTRUCT STAMINA player"
  player: {"species":"WEEZING","level":30,"ability":"NEUTRALIZING_GAS","moves":["SELFDESTRUCT"]}
  enemy: {"species":"MEW","level":100,"ability":"STAMINA","moves":["SPLASH"]}
  rng: forced_low
  turns: 1
  assert:
    - enemy.hp > 0
    - enemy.hp < enemy.start_hp
    - enemy.stat_levels == [7, 7, 7, 7, 7, 7, 7]
    - player.hp == 0
    - wram('wSelfdestructGasTurn') == 0
    - wram('wInAbility') == 0

