- name: "Gas explosion timing: STAMINA resumes next turn player"
  player: {"species":"WEEZING","level":30,"ability":"NEUTRALIZING_GAS","moves":["EXPLOSION"]}
  enemy: {"species":"MEW","level":100,"ability":"STAMINA","moves":["SPLASH"]}
  player2: {species: MEW, level: 30, ability: NO_ABILITY, moves: [TACKLE]}
  rng: forced_low
  turns: 2
  turn_assert:
    - "enemy.stat_levels == ([7, 7, 7, 7, 7, 7, 7] if turns_done == 1 else [7, 8, 7, 7, 7, 7, 7])"
    - wram('wSelfdestructGasTurn') == 0
  assert:
    - turns_done == 2
    - enemy.stat_levels == [7, 8, 7, 7, 7, 7, 7]
    - wram('wSelfdestructGasTurn') == 0

