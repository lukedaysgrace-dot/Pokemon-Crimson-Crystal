# Held-item updates after entry abilities, before the first move.
- name: 'Entry item: player RIPEN'
  player:
    species: APPLIN
    level: 100
    ability: RIPEN
    hp: 45
    item: BERRY
    moves:
    - SPLASH
  enemy:
    species: MAGIKARP
    level: 100
    ability: SWIFT_SWIM
    moves:
    - SPLASH
  rng: forced_high
  turns: 0
  assert:
  - player.hp == (player.maxhp * 45) // 100 + 20
  - player.item == "NO_ITEM"
  - wram("wInAbility") == 0
  - turns_done == 0
