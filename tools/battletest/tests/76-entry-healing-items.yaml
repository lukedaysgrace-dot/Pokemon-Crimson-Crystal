# Held-item updates after entry abilities, before the first move.
# Entry fixtures must use a legal species/ability slot. Arbitrary lead
# overrides are applied after entry; Golett has Klutz in slot 2.
- name: 'Entry item: player RIPEN'
  player:
    species: APPLIN
    level: 100
    ability: RIPEN
    hp: 45
    item: BERRY
    moves:
    - SPLASH
  enemy:
    species: MAGIKARP
    level: 100
    ability: SWIFT_SWIM
    moves:
    - SPLASH
  rng: forced_high
  turns: 0
  assert:
  - player.hp == (player.maxhp * 45) // 100 + 20
  - player.item == "NO_ITEM"
  - wram("wInAbility") == 0
  - turns_done == 0
- name: 'Entry item: player Golett Iron Fist control consumes Berry'
  player: {species: GOLETT, level: 100, ability: IRON_FIST, hp: 45, item: BERRY, moves: [SPLASH]}
  enemy: {species: MAGIKARP, level: 100, ability: SWIFT_SWIM, moves: [SPLASH]}
  rng: forced_high
  turns: 0
  assert:
  - player.ability == 'IRON_FIST'
  - player.hp == (player.maxhp * 45) // 100 + 10
  - player.item == 'NO_ITEM'
  - turns_done == 0
- name: 'Entry item: enemy Golett Iron Fist control consumes Berry'
