- name: "Illusion: legal Totodile entry disguises without changing its real data"
  player: {species: TOTODILE, level: 70, ability: ILLUSION, moves: [SPLASH]}
  player2: {species: GENGAR, level: 20, moves: [SPLASH]}
  enemy: {species: MEW, level: 30, moves: [SPLASH]}
  turns: 0
  assert:
    - wram('wPlayerIllusionSlot') == 2
    - player.species == 'TOTODILE'
    - player.level == 70
    - player.ability == 'ILLUSION'
    - buffer_is('wBattleMonNick', 'GENGAR')

- name: "Illusion: first hit reveals and boosts Speed once across later hits"
  player: {species: TOTODILE, level: 100, ability: ILLUSION, moves: [SPLASH]}
  player2: {species: GENGAR, level: 50, moves: [SPLASH]}
  enemy: {species: MEW, level: 10, moves: [TACKLE]}
  rng: forced_high
  turns: 3
  turn_assert:
    - player.stat_levels[2] == 8
    - player.stats['speed'] == player.start_stats['speed'] * 3 // 2
    - wram('wPlayerIllusionSlot') == 0
    - buffer_is('wBattleMonNick', 'TOTODILE')
  assert: ["player.hp < player.start_hp", "wram('wInAbility') == 0"]

- name: "Illusion: switching out and back restores disguise and a new single boost"
  player: {species: TOTODILE, level: 100, ability: ILLUSION, moves: [SPLASH]}
  player2: {species: GENGAR, level: 100, moves: [SPLASH]}
  enemy: {species: MEW, level: 10, moves: [TACKLE, SPLASH]}
  rng: forced_high
  turns: 5
  move_script: [1, 'switch:2', 'switch:1', 1, 1]
  turn_setup_wram:
    1: {wEnemyMonMoves: {move: SPLASH}}
    3: {wEnemyMonMoves: {move: TACKLE}}
  turn_assert:
    - turns_done != 1 or player.stat_levels[2] == 8
    - turns_done != 3 or wram('wPlayerIllusionSlot') == 2
    - turns_done != 3 or player.stat_levels[2] == 7
    - turns_done != 4 or player.stat_levels[2] == 8
    - turns_done != 5 or player.stat_levels[2] == 8
  assert: ["wram('wPlayerIllusionSlot') == 0", "player.stat_levels[2] == 8"]

- name: "Illusion: no party partner means no disguise or Speed reward"
  player: {species: TOTODILE, level: 100, ability: ILLUSION, moves: [SPLASH]}
  enemy: {species: MEW, level: 10, moves: [TACKLE]}
  rng: forced_high
  turns: 1
  assert: ["wram('wPlayerIllusionSlot') == 0", "player.stat_levels[2] == 7"]

- name: "Illusion: enemy trainer uses front sprite disguise and reveals once"
