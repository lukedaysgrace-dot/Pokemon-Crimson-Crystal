# Trainer AI must distinguish damaging type immunity from status immunity,
# and reflectable moves from moves blocked by Substitute.
# FALKNER enables all scoring layers. CANT_RUN prevents bench-switch heuristics.
# A forced-high tie picks move slot 1; Haze is a nonreflectable alternative.

- name: "AI uses Sing against a Ghost type"
  player: { species: GENGAR, level: 50, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy: { species: MEW, level: 50, ability: NO_ABILITY, moves: [SING, HAZE] }
  enemy2: { species: PIDGEY, level: 50, ability: NO_ABILITY, moves: [SPLASH] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'SING'

