# Trainer-AI awareness of the 2026-08-14 ability batch.
#
# All cases run as TRAINER battles (enemy2 present) against the FALKNER
# class (enemy_class) so every scoring layer - AI_SMART, AI_ABILITIES,
# AI_ELITE - is active. rng: forced_high forces the home-bank Random
# too, so the AI takes every "smart" branch deterministically (AI_50_50 /
# AI_80_20 return nc) and always picks SLOT 1 among tied moves.
# Each pair therefore puts the ability-sensitive move where a tie would
# select it in the control case and asserts the fix flips the choice.
# enemy_move() = the move the AI picked on the last turn (wCurEnemyMove).
# Every player mon carries SUBSTATUS_CANT_RUN: AI_SwitchOrTryItem never
# switches while the player is trapped, which keeps the lead mon in and the
# test about move scoring rather than the switch heuristics.

# ---- Suction Cups: Roar fails, so the AI stops picking it ---------------
- name: "AI control: Roar is picked (tie, slot 1)"
  # (no player bench: a forced drag-out under pinned RNG spins in the
  # random party pick, and the AI's choice is all this case is about)
  player:  { species: OCTILLERY, level: 50, ability: SNIPER, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy:   { species: PIDGEY, level: 50, moves: [ROAR, HAZE] }
  enemy2:  { species: PIDGEY, level: 50, moves: [TACKLE] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'ROAR'

- name: "AI: Roar is dismissed into Suction Cups"
  player:  { species: OCTILLERY, level: 50, ability: SUCTION_CUPS, substatus: [CANT_RUN], moves: [SPLASH] }
  player2: { species: RATTATA, level: 50, moves: [TACKLE] }
  enemy:   { species: PIDGEY, level: 50, moves: [ROAR, HAZE] }
  enemy2:  { species: PIDGEY, level: 50, moves: [TACKLE] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'HAZE'
    - player.species == 'OCTILLERY'

# ---- Knock Off vs Sticky Hold / Unburden / berry abilities -------------
# Knock Off (slot 1) normally ties Swords Dance on turn 1 at 18 each
# (-1 strongest attack, -1 AI_Smart_KnockOff vs -2 AI_Setup).
- name: "AI control: Knock Off is picked against an ordinary item holder"
  player:  { species: HITMONLEE, level: 100, ability: LIMBER, item: LEFTOVERS, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy:   { species: MURKROW, level: 50, moves: [KNOCK_OFF, SWORDS_DANCE] }
  enemy2:  { species: MURKROW, level: 50, moves: [PECK] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'KNOCK_OFF'
    - player.item == 'NO_ITEM'

- name: "AI: Knock Off gets no item bonus against Sticky Hold"
  player:  { species: HITMONLEE, level: 100, ability: STICKY_HOLD, item: LEFTOVERS, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy:   { species: MURKROW, level: 50, moves: [KNOCK_OFF, SWORDS_DANCE] }
  enemy2:  { species: MURKROW, level: 50, moves: [PECK] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'SWORDS_DANCE'
    - player.item == 'LEFTOVERS'

- name: "AI: Knock Off is discouraged against an Unburden item holder"
  player:  { species: HITMONLEE, level: 100, ability: UNBURDEN, item: LEFTOVERS, substatus: [CANT_RUN], moves: [SPLASH] }
  enemy:   { species: MURKROW, level: 50, moves: [KNOCK_OFF, SWORDS_DANCE] }
  enemy2:  { species: MURKROW, level: 50, moves: [PECK] }
  enemy_class: FALKNER
  rng: forced_high
  turns: 1
  assert:
    - enemy_move() == 'SWORDS_DANCE'
    - player.item == 'LEFTOVERS'

# Against a berry ability the extra -1 beats Swords Dance outright; put
# Knock Off in slot 2 so only the bonus (not the tie-break) can pick it.
- name: "AI control: Swords Dance wins the turn-1 tie from slot 1"
