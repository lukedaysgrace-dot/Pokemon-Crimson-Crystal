  assert: ["enemy.start_hp - enemy.hp == 2 * (player.start_hp - player.hp)", "player.hp < player.start_hp", "wram('wPlayerCounterHitDamage') * 256 + wram('wPlayerCounterHitDamage', 1) == player.start_hp - player.hp"]

