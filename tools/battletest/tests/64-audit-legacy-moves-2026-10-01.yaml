- name: "Audit moves extra: player COUNTER reflects fixed level damage"
  player: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["COUNTER"]}
  enemy: {"species": "MEW", "level": 20, "ability": "NO_ABILITY", "moves": ["SEISMIC_TOSS"]}
  rng: forced_high
  turns: 1
  assert: ["enemy.start_hp - enemy.hp == 2 * (player.start_hp - player.hp)", "wram('wPlayerCounterHitDamage') * 256 + wram('wPlayerCounterHitDamage', 1) == player.start_hp - player.hp"]

- name: "Audit moves extra: player MIRROR_COAT reflects fixed level damage"
  player: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["MIRROR_COAT"]}
