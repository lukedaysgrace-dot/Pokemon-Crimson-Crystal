- name: "Audit moves extra: player Beat Up includes its burned active user and applies burn"
  player: {"species": "MEW", "level": 30, "ability": "NO_ABILITY", "moves": ["BEAT_UP"], "status_byte": 16}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"]}
