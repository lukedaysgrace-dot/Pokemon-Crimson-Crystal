- name: "Audit moves extra: player Beat Up modern live-stat control"
  id: player_beat_up_neutral
  player: {"species": "MEW", "level": 30, "ability": "NO_ABILITY", "moves": ["BEAT_UP"]}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"]}
  rng: forced_high
  turns: 1
  assert: ["enemy.hp < enemy.start_hp"]

- name: "Audit moves extra: player Beat Up respects user Attack stages"
  player: {"species": "MEW", "level": 30, "ability": "NO_ABILITY", "moves": ["BEAT_UP"], "stages": {"atk": 2}}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"]}
  rng: forced_high
  turns: 1
  assert: ["enemy.start_hp - enemy.hp > result('player_beat_up_neutral')['enemy'][\"damage\"]"]

- name: "Audit moves extra: player Beat Up respects target Defense stages"
  player: {"species": "MEW", "level": 30, "ability": "NO_ABILITY", "moves": ["BEAT_UP"]}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"], "stages": {"def": 2}}
  rng: forced_high
  turns: 1
  assert: ["enemy.start_hp - enemy.hp < result('player_beat_up_neutral')['enemy'][\"damage\"]"]

- name: "Audit moves extra: player Beat Up receives Dark STAB"
  player: {"species": "MEW", "level": 30, "ability": "NO_ABILITY", "moves": ["BEAT_UP"]}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"]}
  rng: forced_high
  turns: 1
  setup_wram: {"wBattleMonType1": 27, "wBattleMonType2": 27}
  assert: ["enemy.start_hp - enemy.hp > result('player_beat_up_neutral')['enemy'][\"damage\"]"]

- name: "Audit moves extra: player Beat Up includes its poisoned active user"
  player: {"species": "MEW", "level": 30, "ability": "NO_ABILITY", "moves": ["BEAT_UP"], "status_byte": 8}
