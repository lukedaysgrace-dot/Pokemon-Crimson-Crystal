- name: "Audit moves extra: player Counter reflects only Parental Bond final actual hit"
  player: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["COUNTER"]}
  enemy: {"species": "MEW", "level": 20, "ability": "PARENTAL_BOND", "moves": ["TACKLE"]}
