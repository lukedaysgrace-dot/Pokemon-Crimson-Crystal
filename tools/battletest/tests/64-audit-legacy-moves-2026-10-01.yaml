# Modern Transform, Beat Up, Bide, Counter and Mirror Coat regressions.

- name: "Audit moves extra: player Transform raw-stat control"
  id: player_transform_stats
  player: {"species": "MEW", "level": 50, "ability": "NO_ABILITY", "moves": ["TRANSFORM"]}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"], "stages": {"atk": 1, "satk": 2}}
  rng: forced_high
  turns: 1
  assert: ["player.stat_levels[0] == 8", "player.stat_levels[3] == 9"]

- name: "Audit moves extra: player Transform ignores target status 16"
  player: {"species": "MEW", "level": 50, "ability": "NO_ABILITY", "moves": ["TRANSFORM"]}
  enemy: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["SPLASH"], "stages": {"atk": 1, "satk": 2}, "status_byte": 16}
  rng: forced_high
  turns: 1
  assert: ["player.stats == result('player_transform_stats')['player'][\"stats\"]"]

