- name: "Audit moves extra: player Counter sees Parental Bond second hit after first breaks Substitute"
  player: {"species": "MEW", "level": 100, "ability": "NO_ABILITY", "moves": ["COUNTER"], "substatus": ["SUBSTITUTE"]}
