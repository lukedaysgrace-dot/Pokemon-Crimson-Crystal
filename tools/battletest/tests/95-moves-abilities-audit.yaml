# Focused mechanics gaps found by the move/ability audit.

- name: "Moves audit: Heal Bell cures an inactive Soundproof reserve"
  player: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 8, moves: [HEAL_BELL]}
  player2: {species: MR__MIME, level: 50, ability: SOUNDPROOF, status_byte: 16, moves: [SPLASH]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert: ["player.status == 0", "wram('wPartyMon2Status') == 0"]

- name: "Moves audit: Heal Bell cures a reserve without Soundproof"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [HEAL_BELL]}
  player2: {species: MR__MIME, level: 50, ability: FILTER, status_byte: 16, moves: [SPLASH]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert: ["wram('wPartyMon2Status') == 0"]

- name: "Moves audit: enemy Heal Bell cures an inactive Soundproof reserve"
  player: {species: MEW, level: 100, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 8, moves: [HEAL_BELL]}
  enemy2: {species: MR__MIME, level: 50, ability: SOUNDPROOF, status_byte: 16, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert: ["enemy.status == 0", "wram('wOTPartyMon2Status') == 0"]

- name: "Moves audit: a Soundproof Heal Bell user can cure itself"
  player: {species: MR__MIME, level: 50, ability: SOUNDPROOF, status_byte: 16, moves: [HEAL_BELL]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_high
  turns: 1
  assert: ["player.status == 0"]

- name: "Moves audit: Sleep Talk cannot call Bounce for the player"
  player: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 7, moves: [SLEEP_TALK, BOUNCE]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: seeded
  rng_value: 29
  turns: 1
  assert:
    - (player.substatus[2] & 0x70) == 0
    - wram('wCurPlayerMove') == wram('wBattleMonMoves')
    - textbox_seen('ButItFailedText')
    - enemy.hp == enemy.start_hp
    - player.pp[0] == 9 and player.pp[1] == 5

- name: "Moves audit: Sleep Talk cannot call Bounce for the enemy"
  player: {species: MEW, level: 100, ability: NO_ABILITY, substatus: [CANT_RUN], moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 7, moves: [SLEEP_TALK, BOUNCE]}
  enemy2: {species: MEW, level: 50, ability: NO_ABILITY, moves: [SPLASH]}
  enemy_class: FALKNER
  rng: seeded
  rng_value: 29
  turns: 1
  assert:
    - (enemy.substatus[2] & 0x70) == 0
    - enemy_move() == 'SLEEP_TALK'
    - textbox_seen('ButItFailedText')
    - player.hp == player.start_hp
    - enemy.pp[0] == 9 and enemy.pp[1] == 5

- name: "Moves audit: Sleep Talk can still call Tackle"
  player: {species: MEW, level: 50, ability: NO_ABILITY, status_byte: 7, moves: [SLEEP_TALK, TACKLE]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: seeded
  rng_value: 29
  turns: 1
  assert: ["enemy.hp < enemy.start_hp", "player.pp[0] == 9 and player.pp[1] == 35"]

- name: "Moves audit: player Gyro Ball equal speeds give 26 power"
  player: {species: MEW, level: 50, ability: NO_ABILITY, moves: [GYRO_BALL]}
  enemy: {species: MEW, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  setup_wram: {wBattleMonSpeed: [0, 100], wEnemyMonSpeed: [0, 100]}
  rng: forced_high
  turns: 1
  assert: ["enemy.hp < enemy.start_hp", "wram('wDamageCalcBasePower') == 26"]

