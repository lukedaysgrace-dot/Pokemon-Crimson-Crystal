- name: "Ability audit: delayed player Yawn respects Leaf Guard despite Mold Breaker"
  player: {species: MEW, level: 50, ability: MOLD_BREAKER, moves: [YAWN, SPLASH]}
  enemy: {species: SNORLAX, level: 100, ability: LEAF_GUARD, moves: [SPLASH]}
  move_script: [1, 2]
  weather: sun
  rng: forced_high
  turns: 2
  turn_assert:
    - turns_done != 1 or wram('wEnemyYawnCount') == 1
  assert:
    - enemy.status == 0
    - wram('wEnemyYawnCount') == 0

- name: "Ability audit: delayed enemy Yawn respects Leaf Guard despite Mold Breaker"
  player: {species: SNORLAX, level: 100, ability: LEAF_GUARD, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: MOLD_BREAKER, moves: [YAWN]}
  weather: sun
  rng: forced_high
  turns: 2
  turn_assert:
    - turns_done != 1 or wram('wPlayerYawnCount') == 1
  assert:
    - player.status == 0
    - wram('wPlayerYawnCount') == 0

