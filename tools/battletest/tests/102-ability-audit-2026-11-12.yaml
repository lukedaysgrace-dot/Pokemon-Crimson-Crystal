# Native controls for ability/item interactions found in the November 12 audit.

- name: "Ability audit: Covert Cloak blocks player's Poison Touch"
  player: {species: MEW, level: 50, ability: POISON_TOUCH, moves: [TACKLE]}
  enemy: {species: SNORLAX, level: 100, ability: NO_ABILITY, item: COVERT_CLOAK, moves: [SPLASH]}
  rng: forced_low
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp
    - enemy.status == 0

- name: "Ability audit: Covert Cloak blocks enemy's Poison Touch"
  player: {species: SNORLAX, level: 100, ability: NO_ABILITY, item: COVERT_CLOAK, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: POISON_TOUCH, moves: [TACKLE]}
  rng: forced_low
  turns: 1
  assert:
    - player.hp < player.start_hp
    - player.status == 0

- name: "Ability audit control: player's Poison Touch poisons without a Cloak"
  player: {species: MEW, level: 50, ability: POISON_TOUCH, moves: [TACKLE]}
  enemy: {species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  rng: forced_low
  turns: 1
  assert:
    - (enemy.status & 8) != 0

- name: "Ability audit control: enemy's Poison Touch poisons without a Cloak"
  player: {species: SNORLAX, level: 100, ability: NO_ABILITY, moves: [SPLASH]}
  enemy: {species: MEW, level: 50, ability: POISON_TOUCH, moves: [TACKLE]}
  rng: forced_low
  turns: 1
  assert:
    - (player.status & 8) != 0

