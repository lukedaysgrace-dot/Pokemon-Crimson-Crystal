# Hidden Power interactions found in the 2026-11-10 audit: code that read the
# move table's type/power for Hidden Power saw only its placeholder entry
# (Normal, power 1) instead of the user's own type and the fixed 70 power.
#
# Type constants: FLYING=2, ELECTRIC=23, DARK=27.

# ---- Gale Wings ---------------------------------------------------------
- name: "HP interactions: Gale Wings gives a Flying Hidden Power +1 priority"
  # Talonflame is slower than Electrode; only the priority boost lets it go first
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  enemy:  { species: ELECTRODE, level: 50, moves: [SPLASH] }
  setup_wram: { wBattleMonHiddenPowerType: 2 }
  rng: forced_high
  turns: 1
  assert:
    - wram('wPlayerMoveStructType') == 2
    - wram('wEnemyGoesFirst') == 0

- name: "HP interactions: Gale Wings does not boost a non-Flying Hidden Power"
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  enemy:  { species: ELECTRODE, level: 50, moves: [SPLASH] }
  rng: forced_high
  turns: 1
  assert:
    - wram('wPlayerMoveStructType') == 27
    - wram('wEnemyGoesFirst') == 1

- name: "HP interactions: enemy Gale Wings boosts its own Flying Hidden Power"
  player: { species: ELECTRODE, level: 50, moves: [SPLASH] }
  enemy:  { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  setup_wram: { wEnemyMonHiddenPowerType: 2 }
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 1

- name: "HP interactions: enemy Gale Wings ignores the player's Flying Hidden Power type"
  # only the enemy's own stored type counts for the enemy's move
  player: { species: ELECTRODE, level: 50, moves: [SPLASH] }
  enemy:  { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  setup_wram: { wBattleMonHiddenPowerType: 2 }
  rng: forced_high
  turns: 1
  assert:
    - wram('wEnemyGoesFirst') == 0

# ---- Forewarn -----------------------------------------------------------
- name: "HP interactions: Forewarn ranks Hidden Power at 70, below a 75-power move"
  player: { species: JYNX, level: 50, ability: FOREWARN, moves: [SPLASH] }
  enemy:  { species: MEW, level: 50, ability: NO_ABILITY, moves: [HIDDEN_POWER, ROCK_SLIDE] }
  rng: forced_high
  turns: 0
  assert: ["text_seen('ROCK SLIDE')"]

- name: "HP interactions: Forewarn ranks Hidden Power at 70, above a 65-power move"
  player: { species: JYNX, level: 50, ability: FOREWARN, moves: [SPLASH] }
  enemy:  { species: MEW, level: 50, ability: NO_ABILITY, moves: [PSYBEAM, HIDDEN_POWER] }
  rng: forced_high
  turns: 0
  assert: ["text_seen('HIDDEN POWER')"]

# ---- Conversion2 --------------------------------------------------------
- name: "HP interactions: Conversion2 resists the Hidden Power type that was used (seed 1)"
  # Electrode's Electric Hidden Power lands first. Conversion2 must pick a
  # type that resists Electric (Ground 4, Grass 22, Electric 23, Dragon 26),
  # none of which resists the move table's Normal placeholder type.
  player: { species: PORYGON2, level: 50, moves: [CONVERSION2] }
  enemy:  { species: ELECTRODE, level: 50, ability: NO_ABILITY, moves: [HIDDEN_POWER] }
  setup_wram: { wEnemyMonHiddenPowerType: 23 }
  rng: seeded
  rng_value: 1
  turns: 1
  assert:
    - wram('wBattleMonType1') in (4, 22, 23, 26)
    - wram('wBattleMonType1') == wram('wBattleMonType2')

- name: "HP interactions: Conversion2 resists the Hidden Power type that was used (seed 2)"
  # Electrode's Electric Hidden Power lands first. Conversion2 must pick a
  # type that resists Electric (Ground 4, Grass 22, Electric 23, Dragon 26),
  # none of which resists the move table's Normal placeholder type.
  player: { species: PORYGON2, level: 50, moves: [CONVERSION2] }
  enemy:  { species: ELECTRODE, level: 50, ability: NO_ABILITY, moves: [HIDDEN_POWER] }
  setup_wram: { wEnemyMonHiddenPowerType: 23 }
  rng: seeded
  rng_value: 2
  turns: 1
  assert:
    - wram('wBattleMonType1') in (4, 22, 23, 26)
    - wram('wBattleMonType1') == wram('wBattleMonType2')

- name: "HP interactions: Conversion2 resists the Hidden Power type that was used (seed 3)"
  # Electrode's Electric Hidden Power lands first. Conversion2 must pick a
  # type that resists Electric (Ground 4, Grass 22, Electric 23, Dragon 26),
  # none of which resists the move table's Normal placeholder type.
  player: { species: PORYGON2, level: 50, moves: [CONVERSION2] }
  enemy:  { species: ELECTRODE, level: 50, ability: NO_ABILITY, moves: [HIDDEN_POWER] }
  setup_wram: { wEnemyMonHiddenPowerType: 23 }
  rng: seeded
  rng_value: 3
  turns: 1
  assert:
    - wram('wBattleMonType1') in (4, 22, 23, 26)
    - wram('wBattleMonType1') == wram('wBattleMonType2')

# ---- Queenly Majesty / Armor Tail see the Gale Wings boost ---------------
- name: "HP interactions: Queenly Majesty blocks a Gale Wings Flying Hidden Power"
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  enemy:  { species: MEW, level: 50, ability: QUEENLY_MAJESTY, moves: [SPLASH] }
  setup_wram: { wBattleMonHiddenPowerType: 2 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp == enemy.start_hp

- name: "HP interactions: Queenly Majesty lets a non-Flying Hidden Power through"
  # the foe's own stored type must not be mistaken for the attacker's
  player: { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  enemy:  { species: MEW, level: 50, ability: QUEENLY_MAJESTY, moves: [SPLASH] }
  setup_wram: { wEnemyMonHiddenPowerType: 2 }
  rng: forced_high
  turns: 1
  assert:
    - enemy.hp < enemy.start_hp

- name: "HP interactions: Armor Tail blocks the enemy's Gale Wings Flying Hidden Power"
  player: { species: MEW, level: 50, ability: ARMOR_TAIL, moves: [SPLASH] }
  enemy:  { species: TALONFLAME, level: 50, ability: GALE_WINGS, moves: [HIDDEN_POWER] }
  setup_wram: { wEnemyMonHiddenPowerType: 2 }
  rng: forced_high
  turns: 1
  assert:
    - player.hp == player.start_hp
