name: Crimson Editor checks
on:
  push:
    paths:
      [
        "crimson-editor/**",
        "constants/**",
        "data/**",
        "engine/**",
        "gfx/**",
        "home/**",
        "macros/**",
        "*.asm",
        "Makefile",
        "tools/audit_save.py",
        "tools/save_layout_lock.py",
        "save_layout.lock",
        ".github/workflows/crimson-editor.yml",
      ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y bison flex libpng-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: crimson-editor/.toolchain
          key: rgbds-0.5.2-${{ runner.os }}-source-v1
      - run: bash crimson-editor/tools/build-crimson.sh
      - run: pnpm install --frozen-lockfile --store-dir .pnpm-store --node-linker=hoisted --config.enable-global-virtual-store=false
        working-directory: crimson-editor
      - name: Extract and verify compiled game data
        working-directory: crimson-editor
        run: |
          game_sha=$(git log -1 --format=%H -- '../*.asm' '../constants' '../data' '../engine' '../home' '../gfx' '../macros' '../Makefile')
          pnpm extract -- --build "$game_sha"
          pnpm exec tsx tools/prune-sprites.ts --write
          pnpm validate-data -- --build "$game_sha"
          pnpm audit:sprites -- --profile "static/gamedata/${game_sha:0:8}.json"
          python ../tools/save_layout_lock.py --profile "static/gamedata/${game_sha:0:8}.json"
      - run: pnpm check && pnpm test && pnpm build
        working-directory: crimson-editor
      - name: Release/debug saved symbol parity
        run: python crimson-editor/tools/check_layouts.py pokecrystal.sym pokecrystal_debug.sym
      - run: pnpm exec playwright install --with-deps chromium && pnpm test:ui
        working-directory: crimson-editor
      - name: GitHub Pages website integration
        working-directory: crimson-editor
        run: pnpm build:website && pnpm test:website
      - run: python -m pip install pyboy==2.7.0 PyYAML Pillow
      - name: Emulator round trip
        working-directory: crimson-editor
        run: |
          pnpm exec tsx tools/fixtures/export.ts
          python tools/roundtrip/pyboy_check.py
      - name: New game, editor UI, Continue and native resave
        working-directory: crimson-editor
        run: |
          python tools/roundtrip/fresh_game_check.py create --out tests/output/fresh-game
          CRIMSON_FRESH_TEST_DIR="$PWD/tests/output/fresh-game" pnpm exec playwright test tests/ui/fresh-save.spec.ts
          python tools/roundtrip/fresh_game_check.py verify --out tests/output/fresh-game --save tests/output/fresh-game/editor-added-pokemon.sav --expected tests/output/fresh-game/editor-expected.json
      - uses: actions/upload-artifact@v4
        with:
          name: crimson-editor-static-and-ROM-symbols
          path: |
            crimson-editor/build/
            pokecrystal.gbc
            pokecrystal.sym
            pokecrystal.map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-test-artifacts
          path: |
            crimson-editor/test-results/
            crimson-editor/tests/output/fresh-game/
